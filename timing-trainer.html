<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entraînement au Sens du Temps</title>
	
    <!-- <link href="./css/bootstrap.min.css" rel="stylesheet"> -->
    <!-- <link rel="stylesheet" href="./css/bootstrap-icons.min.css"> -->
    <!-- <script src="./js/14.8.49/Tone.js"></script> -->
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
	
    <style>
        .beat-card { transition: all 0.15s ease-in-out; }
        .beat-card.active-play { transform: scale(1.08); border-color: #0d6efd !important; box-shadow: 0 0 15px rgba(13, 110, 253, 0.5); }
        .beat-card.active-silent { transform: scale(1.03); border-color: #6c757d !important; box-shadow: 0 0 10px rgba(108, 117, 125, 0.3); }
        
        /* Cible visuelle */
        .target-bar { height: 12px; background: #333; position: relative; border-radius: 6px; overflow: hidden; }
        .target-center { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #0d6efd; transform: translateX(-50%); }
        .hit-marker { position: absolute; top: 0; bottom: 0; width: 8px; border-radius: 4px; transform: translateX(-50%); transition: left 0.1s ease-out; }
        
        #tapArea { user-select: none; touch-action: manipulation; }
        #tapArea:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-dark text-light min-vh-100 d-flex flex-column justify-content-center py-4">

<div class="container" style="max-width: 800px;">
    <div class="card bg-secondary bg-opacity-10 border-secondary shadow-lg">
        <div class="card-header border-secondary text-center py-3">
            <h1 class="h3 mb-0"><i class="bi bi-metronome me-2 text-primary"></i>Développement du Sens du Temps</h1>
            <p class="text-muted small mb-0 mt-1">Tapez sur la barre d'espace ou sur le grand bouton bleu</p>
        </div>
        
        <div class="card-body p-4">
            
            <!-- Presets -->
            <div class="mb-4">
                <label for="presetSelect" class="form-label fw-bold"><i class="bi bi-bookmarks me-1"></i> Presets d'entraînement</label>
                <select id="presetSelect" class="form-select bg-dark text-light border-secondary">
                    <option value="">-- Choisir un preset --</option>
                    <option value="p1">1. Tout joué (Metronome classique)</option>
                    <option value="p2">2. Uniquement le 1er temps (Ancre de mesure)</option>
                    <option value="p3">3. Temps faibles Jazz/Pop (Temps 2 et 4)</option>
                    <option value="p4" selected>4. Le 4ème temps uniquement (Anticipation de mesure)</option>
                    <option value="p5">5. Le 3ème temps uniquement (Balance centrale)</option>
                    <option value="p6">6. Le "2" uniquement (Rebond)</option>
                    <option value="p7">7. Extrémités (Temps 1 et 4)</option>
                </select>
            </div>

            <!-- Tempo & Mesure -->
            <div class="row g-3 mb-4 align-items-center">
                <div class="col-md-6">
                    <label for="bpmRange" class="form-label fw-bold d-flex justify-content-between">
                        <span><i class="bi bi-speedometer2 me-1"></i> Tempo (BPM)</span>
                        <span id="bpmDisplay" class="badge bg-primary fs-6">80 BPM</span>
                    </label>
                    <input type="range" class="form-range" id="bpmRange" min="40" max="200" value="80">
                </div>
                <div class="col-md-6">
                    <label for="beatsPerMeasure" class="form-label fw-bold"><i class="bi bi-grid-3x3-gap me-1"></i> Temps par mesure</label>
                    <select id="beatsPerMeasure" class="form-select bg-dark text-light border-secondary">
                        <option value="2">2 temps</option>
                        <option value="3">3 temps</option>
                        <option value="4" selected>4 temps</option>
                    </select>
                </div>
            </div>

            <!-- Grille des temps -->
            <div class="accordion mb-4" id="beatsAccordion">
			  <div class="accordion-item bg-dark border-secondary">
				<h2 class="accordion-header">
				  <button class="accordion-button bg-dark text-light border-secondary collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBeats">
					<i class="bi bi-sliders me-2"></i> Configuration des temps (🔊 Écouter / 🎯 Mesurer)
				  </button>
				</h2>
				<div id="collapseBeats" class="accordion-collapse collapse" data-bs-parent="#beatsAccordion">
				  <div class="accordion-body">
					<div id="beatsContainer" class="row g-2 justify-content-center"></div>
				  </div>
				</div>
			  </div>
			</div>

            <!-- Bouton Play/Stop -->
            <div class="d-grid gap-2 mb-4">
                <button id="playBtn" class="btn btn-outline-light btn-lg py-2 fw-bold">
                    <i class="bi bi-play-fill me-2"></i> Activer le métronome
                </button>
            </div>

            <!-- ZONE DE FRAPPE ET FEEDBACK -->
            <div class="p-3 bg-dark rounded border border-secondary text-center">
                <div id="tapArea" class="p-4 rounded bg-primary text-white fw-bold fs-4 mb-3 cursor-pointer shadow" style="display: none;">
                    <i class="bi bi-hand-index-thumb me-2"></i> TAPEZ ICI (ou ESPACE)
                </div>

                <!-- Afficheur de Précision -->
                <div id="feedbackResult" class="fs-3 fw-bold mb-2 text-muted">En attente de frappe...</div>
                
                <!-- Cible visuelle (Gauche = En avance / Droite = En retard) -->
                <div class="target-bar mb-2">
                    <div class="target-center"></div>
                    <div id="hitMarker" class="hit-marker" style="left: 50%; display: none;"></div>
                </div>
                <div class="d-flex justify-content-between text-muted small">
                    <span>TROP TÔT (En avance)</span>
                    <span>PARFAIT</span>
                    <span>TROP TARD (En retard)</span>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- <script src="./js/bootstrap.min.js"></script> -->
    
	
	<!-- <script src="./js/bootstrap.min.js"></script> -->
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Synthétiseurs
const highClick = new Tone.MembraneSynth({ pitchDecay: 0.008, octaves: 2, oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0 } }).toDestination();
const lowClick = new Tone.MembraneSynth({ pitchDecay: 0.008, octaves: 2, oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.03, sustain: 0 } }).toDestination();

// Synthé de feedback utilisateur (Onde sinusoïdale pure pour percevoir le pitch)
const userTapSynth = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.08, sustain: 0, release: 0.1 }
}).toDestination();

highClick.volume.value = -6;
lowClick.volume.value = -6;
userTapSynth.volume.value = 0;

let isPlaying = false;
let currentBeat = 0;
let loopEvent = null;
let lastBeatTimes = {}; // Horodatage exact de chaque temps

// Éléments DOM
const playBtn = document.getElementById('playBtn');
const bpmRange = document.getElementById('bpmRange');
const bpmDisplay = document.getElementById('bpmDisplay');
const beatsPerMeasureSelect = document.getElementById('beatsPerMeasure');
const beatsContainer = document.getElementById('beatsContainer');
const presetSelect = document.getElementById('presetSelect');
const tapArea = document.getElementById('tapArea');
const feedbackResult = document.getElementById('feedbackResult');
const hitMarker = document.getElementById('hitMarker');

// 1. Rendu de la grille dynamique (Jusqu'à 16 temps + Séparation Écouter/Mesurer + Accordéon)
function renderBeatsGrid(count) {
    beatsContainer.innerHTML = '';
    
    // Découpage réactif en colonnes
    let colClass = 'col-3 col-md-2 col-lg-1';
    if (count <= 4) colClass = `col-${12 / count}`;
    else if (count <= 8) colClass = `col-3 col-md-3`;

    for (let i = 1; i <= count; i++) {
        const col = document.createElement('div');
        col.className = `${colClass} text-center mb-2`;
        col.innerHTML = `
            <div class="card bg-dark border-secondary beat-card p-2" id="beat-card-${i}">
                <div class="fw-bold fs-6 mb-1 text-primary">${i}</div>
                <div class="form-check form-switch d-flex flex-column align-items-center mb-1" title="Entendre ce temps">
                    <input class="form-check-input listen-checkbox ms-0" type="checkbox" id="listen-${i}" ${i === 1 ? 'checked' : ''}>
                    <label class="form-check-label text-muted align-self-center" style="font-size: 0.65rem;">🔊 Écouter</label>
                </div>
                <div class="form-check form-switch d-flex flex-column align-items-center" title="Évaluer la frappe sur ce temps">
                    <input class="form-check-input measure-checkbox ms-0" type="checkbox" id="measure-${i}" ${i === 4 || (count < 4 && i === count) ? 'checked' : ''}>
                    <label class="form-check-label text-muted align-self-center" style="font-size: 0.65rem;">🎯 Mesurer</label>
                </div>
            </div>
        `;
        beatsContainer.appendChild(col);
    }
}

// Extension du sélecteur à 16 temps au niveau HTML/JS
function updateBeatsOptions() {
    beatsPerMeasureSelect.innerHTML = '';
    for(let i = 2; i <= 16; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i} temps`;
        if(i === 4) opt.selected = true;
        beatsPerMeasureSelect.appendChild(opt);
    }
}

// 2. Presets ajustés au système (Écouter / Mesurer)
const presets = {
    p1: { beats: 4, listen: [1, 2, 3, 4], measure: [1, 2, 3, 4] },
    p2: { beats: 4, listen: [1], measure: [1, 2, 3, 4] },
    p3: { beats: 4, listen: [2, 4], measure: [2, 4] },
    p4: { beats: 4, listen: [1], measure: [4] }, // Ancre sur le 1, frappe sur le 4
    p5: { beats: 4, listen: [1], measure: [3] },
    p6: { beats: 8, listen: [1], measure: [5] }, // 8 temps : Ancre sur le 1, frappe sur le 5
};

function applyPreset(key) {
    if (!presets[key]) return;
    const config = presets[key];
    beatsPerMeasureSelect.value = config.beats;
    renderBeatsGrid(config.beats);
    
    config.listen.forEach(b => {
        const cb = document.getElementById(`listen-${b}`);
        if (cb) cb.checked = true;
    });
    config.measure.forEach(b => {
        const cb = document.getElementById(`measure-${b}`);
        if (cb) cb.checked = true;
    });
}

// Listeners de contrôles
bpmRange.addEventListener('input', (e) => {
    bpmDisplay.textContent = `${e.target.value} BPM`;
    Tone.Transport.bpm.value = e.target.value;
});

beatsPerMeasureSelect.addEventListener('change', (e) => {
    renderBeatsGrid(parseInt(e.target.value));
});

presetSelect.addEventListener('change', (e) => { applyPreset(e.target.value); });

// Moteur Audio principal
function startAudio() {
    Tone.Transport.bpm.value = bpmRange.value;
    currentBeat = 0;
    
    loopEvent = new Tone.Loop((time) => {
        const totalBeats = parseInt(beatsPerMeasureSelect.value);
        const activeBeatNumber = currentBeat + 1;
        
        lastBeatTimes[activeBeatNumber] = time;

        const listenCb = document.getElementById(`listen-${activeBeatNumber}`);
        const card = document.getElementById(`beat-card-${activeBeatNumber}`);
        const isAudible = listenCb && listenCb.checked;

        // Son de référence : Temps 1 = A4 (440 Hz), Autres temps = A3 (220 Hz)
        if (isAudible) {
            if (activeBeatNumber === 1) {
                highClick.triggerAttackRelease("A4", "32n", time);
            } else {
                lowClick.triggerAttackRelease("A3", "32n", time);
            }
        }

        Tone.Draw.schedule(() => {
            document.querySelectorAll('.beat-card').forEach(c => c.classList.remove('active-play', 'active-silent'));
            if (card) card.classList.add(isAudible ? 'active-play' : 'active-silent');
        }, time);

        currentBeat = (currentBeat + 1) % totalBeats;
    }, "4n");

    loopEvent.start(0);
    Tone.Transport.start();
    tapArea.style.display = "block";
}

function stopAudio() {
    Tone.Transport.stop();
    if (loopEvent) { loopEvent.dispose(); loopEvent = null; }
    document.querySelectorAll('.beat-card').forEach(c => c.classList.remove('active-play', 'active-silent'));
    tapArea.style.display = "none";
}

// 3. Gestion de la frappe et du Pitch auditif proportionnel
function handleUserTap() {
    if (!isPlaying) return;

    const tapTime = Tone.now();
    const bpm = parseInt(bpmRange.value);
    const beatDuration = 60 / bpm; // Fenêtre maximale d'un temps
    const maxWindow = beatDuration / 2; // Tolerance max (+/- ms)

    let minDiff = Infinity;
    let targetBeat = null;

    // Chercher le temps ciblé le plus proche parmi CEUX QUE L'ON DOIT MESURER
    Object.keys(lastBeatTimes).forEach(beatNum => {
        const measureCb = document.getElementById(`measure-${beatNum}`);
        if (!measureCb || !measureCb.checked) return;

        const theoreticalTime = lastBeatTimes[beatNum];
        let diff = tapTime - theoreticalTime;

        if (diff > maxWindow) diff -= beatDuration;
        if (diff < -maxWindow) diff += beatDuration;

        if (Math.abs(diff) < Math.abs(minDiff)) {
            minDiff = diff;
            targetBeat = beatNum;
        }
    });

    if (targetBeat === null) return; // Aucun temps à mesurer actif

    // Calcul du Pitch continu : 
    // La référence parfaite (0 ms) = A5 (880 Hz) -> Octave supérieure nette du Temps 1
    // Avance (+12 demi-tons max) / Retard (-12 demi-tons max)
    const normalizedShift = Math.max(-1, Math.min(1, minDiff / (maxWindow / 2))); // -1 à +1
    const pitchInSemitones = normalizedShift * 12; // Décalage de -12 à +12 demi-tons
    
    // Calcul de la fréquence exacte basée sur A5 (880Hz)
    const pitchedFreq = 880 * Math.pow(2, pitchInSemitones / 12);
    
    // Émission du son personnalisé
    userTapSynth.triggerAttackRelease(pitchedFreq, "32n", tapTime);

    displayFeedback(minDiff * 1000);
}

function displayFeedback(diffMs) {
    const absDiff = Math.abs(Math.round(diffMs));
    hitMarker.style.display = "block";

    const clampDiff = Math.max(-150, Math.min(150, diffMs));
    const percentage = 50 + (clampDiff / 150) * 50; 
    hitMarker.style.left = `${percentage}%`;

    if (absDiff <= 25) {
        feedbackResult.className = "fs-3 fw-bold mb-2 text-success";
        feedbackResult.textContent = `OCTAVE PARFAITE ! (${absDiff} ms)`;
        hitMarker.style.background = "#198754";
    } else if (diffMs < 0) {
        feedbackResult.className = "fs-3 fw-bold mb-2 text-warning";
        feedbackResult.textContent = `Trop TÔT (-${absDiff} ms) ➔ Note plus aigüe`;
        hitMarker.style.background = "#ffc107";
    } else {
        feedbackResult.className = "fs-3 fw-bold mb-2 text-info";
        feedbackResult.textContent = `Trop TARD (+${absDiff} ms) ➔ Note plus grave`;
        hitMarker.style.background = "#0dcaf0";
    }
}

// Binding
tapArea.addEventListener('pointerdown', (e) => { e.preventDefault(); handleUserTap(); });
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && isPlaying) {
        e.preventDefault();
        handleUserTap();
    }
});

playBtn.addEventListener('click', async () => {
    if (!isPlaying) {
        await Tone.start();
        startAudio();
        playBtn.classList.replace('btn-outline-light', 'btn-danger');
        playBtn.innerHTML = '<i class="bi bi-stop-fill me-2"></i> Arrêter';
        isPlaying = true;
    } else {
        stopAudio();
        playBtn.classList.replace('btn-danger', 'btn-outline-light');
        playBtn.innerHTML = '<i class="bi bi-play-fill me-2"></i> Activer le métronome';
        isPlaying = false;
    }
});

// Initialisation
updateBeatsOptions();
renderBeatsGrid(4);
applyPreset('p4');
</script>

</body>
</html>
