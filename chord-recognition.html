<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur d'Accords à la carte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .note-badge { 
            display: inline-block; 
            padding: 15px 30px; 
            margin: 10px; 
            font-size: 20px; 
            font-weight: bold; 
            border-radius: 50px; 
            background-color: #e9ecef; 
            color: #6c757d; 
            transition: all 0.2s ease;
            border: 2px solid #dee2e6;
        }
        /* Style quand la note est correctement détectée */
        .note-detected { 
            background-color: #d1e7dd; 
            color: #0f5132; 
            border-color: #badbcc;
            transform: scale(1.08);
            box-shadow: 0 4px 10px rgba(25,135,84,0.2);
        }
        .status-box {
            font-size: 26px;
            font-weight: bold;
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-8">
            <h1 class="fw-bold mb-3">🎯 Analyseur d'Accords Précis</h1>
            <p class="text-muted mb-4">Sélectionnez un accord, jouez-le sans vous presser et vérifiez si chaque corde sonne juste.</p>

            <div class="mb-4">
                <button id="controlBtn" class="btn btn-success btn-lg px-5 fw-bold shadow-sm">🚀 Activer le Micro</button>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white">
                    <ul class="nav nav-pills nav-fill" id="chordTabs">
                        <li class="nav-item">
                            <button class="nav-link active fw-bold py-3" onclick="selectChord(0)">Accord de C (Do)</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link fw-bold py-3 text-secondary" onclick="selectChord(1)">Accord de G (Sol)</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link fw-bold py-3 text-secondary" onclick="selectChord(2)">Accord de Am (La min)</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link fw-bold py-3 text-secondary" onclick="selectChord(3)">Accord de F (Fa)</button>
                        </li>
                    </ul>
                </div>
                
                <div class="card-body py-5 bg-white">
                    <h3 class="text-muted mb-4">Notes attendues :</h3>
                    <div id="badgesContainer">
                        </div>
                </div>
            </div>

            <div class="card p-4 shadow-sm bg-white">
                <h4 class="text-muted mb-2">Résultat global :</h4>
                <div id="chordStatus" class="status-box text-secondary">Micro désactivé</div>
            </div>

        </div>
    </div>
</div>

	<footer class="mt-auto py-3 bg-body-tertiary border-top text-body-secondary transition-colors">
	  <div class="container">
		<div class="row align-items-center gy-2">
		  <!-- Colonne 1 : Copyright & Titre -->
		  <div class="col-12 col-md-6 text-center text-md-start">
			<span class="small">
			  CC BY-NC-SA 4.0 <span id="currentYear"></span> <strong>François Parlant</strong> &mdash; Créé avec passion pour le rythme et la mélodie.
			</span>
		  </div>

		  <!-- Colonne 2 : Liens Réseaux Sociaux -->
		  <div class="col-12 col-md-6 text-center text-md-end">
			<div class="d-inline-flex gap-3 align-items-center">
			  <a href="https://github.com/fxpar/abc-notation-artifacts" target="_blank" rel="noopener noreferrer" class="text-body-secondary text-decoration-none fs-5 hover-accent" title="Code source GitHub"> 
				<i class="bi bi-github"></i> 
			  </a> 
			  <a href="https://www.linkedin.com/in/francois-parlant" target="_blank" rel="noopener noreferrer" class="text-body-secondary text-decoration-none fs-5 hover-accent" title="LinkedIn: François Parlant">
				<i class="bi bi-linkedin"></i> 
			  </a> 
			  <a href="https://www.youtube.com/c/enparlantdebureautiqueformezvous" target="_blank" rel="noopener noreferrer" class="text-body-secondary text-decoration-none fs-5 hover-accent" title="Tutos YouTube: En parlant de bureautique">
				<i class="bi bi-youtube"></i> 
			  </a>
			</div>
		  </div>
		</div>
	  </div>
	</footer>

<script>
    // Base de données des accords (gère le Sol grave/aigu, Si aigu, etc.)
    const CHORDS_DB = [
        { name: "C",  notes: [
            { label: "SOL (G)", freqs: [196.0, 392.0] },
            { label: "DO (C)",  freqs: [261.6, 523.2] },
            { label: "MI (E)",  freqs: [329.6] }
        ]},
        { name: "G",  notes: [
            { label: "SOL (G)", freqs: [196.0, 392.0] },
            { label: "SI (B)",  freqs: [246.9, 493.8] },
            { label: "RÉ (D)",  freqs: [293.7] }
        ]},
        { name: "Am", notes: [
            { label: "LA (A)",  freqs: [220.0, 440.0] },
            { label: "DO (C)",  freqs: [261.6, 523.2] },
            { label: "MI (E)",  freqs: [329.6] }
        ]},
        { name: "F",  notes: [
            { label: "FA (F)",  freqs: [174.6, 349.2] },
            { label: "LA (A)",  freqs: [220.0, 440.0] },
            { label: "DO (C)",  freqs: [261.6, 523.2] }
        ]}
    ];

    let currentChordIndex = 0;
    let isRunning = false;
    let audioContext, analyser, dataArray, sampleRate;
    let animationFrameId;
	// À ajouter sous vos variables globales existantes :
const VISUAL_HOLD_TIME = 800; // Temps en millisecondes où la note reste allumée
let noteTimestamps = [0, 0, 0]; // Stocke le moment où chaque note a été vue

    const controlBtn = document.getElementById('controlBtn');
    const badgesContainer = document.getElementById('badgesContainer');
    const chordStatus = document.getElementById('chordStatus');

    // Génère visuellement les ronds pour l'accord choisi
    function renderNotesBadges() {
        badgesContainer.innerHTML = "";
        const activeChord = CHORDS_DB[currentChordIndex];
        
        activeChord.notes.forEach((note, index) => {
            const badge = document.createElement('div');
            badge.id = `note-badge-${index}`;
            badge.className = "note-badge";
            badge.textContent = note.label;
            badgesContainer.appendChild(badge);
        });
    }

    // Gère le changement d'accord lors du clic sur un onglet
    function selectChord(index) {
        currentChordIndex = index;
        
        // Gérer le style des onglets
        const buttons = document.querySelectorAll('#chordTabs button');
        buttons.forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('active', 'btn-primary');
                btn.classList.remove('text-secondary');
            } else {
                btn.classList.remove('active', 'btn-primary');
                btn.classList.add('text-secondary');
            }
        });

        renderNotesBadges();
    }

    // Gestion de l'allumage/extinction du micro
    controlBtn.addEventListener('click', async () => {
        if (isRunning) {
            stopAnalysis();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, 
                video: false 
            });
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 4096; // Haute précision fréquentielle
            dataArray = new Float32Array(analyser.frequencyBinCount);
            sampleRate = audioContext.sampleRate;
            source.connect(analyser);

            isRunning = true;
            controlBtn.textContent = "🛑 Arrêter le Micro";
            controlBtn.className = "btn btn-danger btn-lg px-5 fw-bold shadow-sm";
            chordStatus.textContent = "Écoute en cours... Jouez votre accord !";
            chordStatus.className = "status-box text-warning";
            
            analyzeLoop();

        } catch (err) {
            alert("Erreur d'accès au micro : " + err);
        }
    });

    function stopAnalysis() {
        isRunning = false;
        cancelAnimationFrame(animationFrameId);
        if (audioContext) audioContext.close();
        
        controlBtn.textContent = "🚀 Activer le Micro";
        controlBtn.className = "btn btn-success btn-lg px-5 fw-bold shadow-sm";
        chordStatus.textContent = "Micro désactivé";
        chordStatus.className = "status-box text-secondary";
        
        // Éteindre tous les badges
        const badges = document.querySelectorAll('.note-badge');
        badges.forEach(b => b.classList.remove('note-detected'));
    }

    // Boucle d'analyse en temps réel
    function analyzeLoop() {
        if (!isRunning) return;

        analyser.getFloatFrequencyData(dataArray);
        const threshold = -54; // Seuil de volume (dB) pour capter la note
        const activeChord = CHORDS_DB[currentChordIndex];
        
        // Créer un tableau pour stocker si chaque note requise est détectée
        let detectedNotesState = activeChord.notes.map(() => false);

        // Balayage de la capture audio du micro
        for (let i = 0; i < analyser.frequencyBinCount; i++) {
            let frequency = i * sampleRate / analyser.fftSize;
            let db = dataArray[i];

            // Remplacez la partie de scan des fréquences par celle-ci :
			if (db > threshold) {
				activeChord.notes.forEach((note, noteIndex) => {
					note.freqs.forEach(targetFreq => {
						if (Math.abs(frequency - targetFreq) < 6) {
							// On enregistre l'instant T (en millisecondes) où la note est détectée
							noteTimestamps[noteIndex] = Date.now();
						}
					});
				});
			}
        }

        // Étape graphique : Allumer ou éteindre les badges individuels
        // Remplacez l'étape graphique par celle-ci :
		let totalValidated = true;
		const now = Date.now();

		activeChord.notes.forEach((note, noteIndex) => {
			const badge = document.getElementById(`note-badge-${noteIndex}`);
			
			// La note est considérée active si elle vient d'être jouée OU si elle l'a été il y a moins de 800ms
			const isNoteStillValid = (now - noteTimestamps[noteIndex]) < VISUAL_HOLD_TIME;

			if (badge) {
				if (isNoteStillValid) {
					badge.classList.add('note-detected');
				} else {
					badge.classList.remove('note-detected');
					totalValidated = false; // Il manque une note à l'instant T
				}
			}
		});

        // Mettre à jour le texte de statut global
        if (totalValidated) {
            chordStatus.textContent = `🎉 ACCORD DE ${activeChord.name} PARFAIT !`;
            chordStatus.className = "status-box text-success text-uppercase";
        } else {
            chordStatus.textContent = "En cours d'ajustement...";
            chordStatus.className = "status-box text-warning";
        }

        animationFrameId = requestAnimationFrame(analyzeLoop);
    }

    // Initialisation au chargement de la page pour afficher le premier accord (C)
    renderNotesBadges();
</script>

</body>
</html>
