const ABC_NOTES = ["C", "^C", "D", "^D", "E", "F", "^F", "G", "^G", "A", "^A", "B"];

// Conversion stricte Note -> Pitch MIDI
function noteToMidi(noteStr) {
  const match = noteStr.trim().match(/^([A-G][#b]?)(-?\d+)$/i);
  if (!match) return 60;
  let [, name, oct] = match;
  name = name.toUpperCase();
  let alter = 0;
  if (name.length > 1) {
    alter = name[1] === '#' ? 1 : -1;
    name = name[0];
  }
  const baseMap = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  return (parseInt(oct) + 1) * 12 + baseMap[name] + alter;
}

// Conversion stricte Pitch MIDI -> Notation ABC
function midiToAbc(midi) {
  const noteIdx = (midi % 12 + 12) % 12;
  const octave = Math.floor(midi / 12) - 1;
  let letter = ABC_NOTES[noteIdx];

  if (octave >= 5) {
    letter = letter.toLowerCase();
    if (octave > 5) letter += "'".repeat(octave - 5);
  } else if (octave < 4) {
    letter += ",".repeat(4 - octave);
  }
  return letter;
}

  document.getElementById('stopBassAlphaTab').onclick = () => apiBass.stop();

    core: { engine: 'svg' },
    player: { enablePlayer: true, soundFont: soundFontUrl }

  document.getElementById('stopAlphaTab').onclick = () => apiUku.stop();

  document.getElementById('btnConvert').onclick = processConversion;
  document.getElementById('inputBassTab').oninput = processConversion;
  document.getElementById('octaveShift').onchange = processConversion;

function processConversion() {
  const scrollX = window.scrollX;
  const scrollY = window.scrollY;

  // 1. Inputs
  const bassTuningStr = document.getElementById('bassTuning').value.split(',').map(s => s.trim());
  const bassTuning    = bassTuningStr.map(s => noteToMidi(s));
  
  const ukuTuningStr  = document.getElementById('ukuTuning').value.split(',').map(s => s.trim());
  const ukuTuning     = ukuTuningStr.map(s => noteToMidi(s));

  const inputTokens   = document.getElementById('inputBassTab').value.trim().split(/\s+/);
  const key           = document.getElementById('keySignature').value;
  const bassKey       = document.getElementById('bassKeySignature').value;
  const ukuClef       = document.getElementById('ukuClef').value;
  const bassClef      = document.getElementById('bassClef').value;
  const octaveShift   = parseInt(document.getElementById('octaveShift').value);

  const midiNotes = [];
  const bassAlphaTexNotes = [];

  // 2. Traitement entrée "frette.corde"
  inputTokens.forEach(token => {
    if(!token.includes('.')) return;
    const parts = token.split('.');
    const fret = parseInt(parts[0]);
    const stringNum = parseInt(parts[1]);
    
    if (isNaN(fret) || isNaN(stringNum)) return;

    // Indexation : 1 = Corde la plus aiguë
    const stringIdx = bassTuning.length - stringNum;
    if(bassTuning[stringIdx] !== undefined) {
      midiNotes.push(bassTuning[stringIdx] + fret);
      bassAlphaTexNotes.push(`${fret}.${stringNum}`);
    }
  });

  // 3. Rendu AlphaTab Basse (Noms de notes conservés pour \tuning)
  const bassTuningReverse = [...bassTuningStr].reverse().join(' ');
  const bassAlphaTexContent = bassAlphaTexNotes.length > 0 ? bassAlphaTexNotes.join(" ") : "0.1";
  const fullBassAlphaTex = `\\title "Bass Tab"\n\\clef ${bassClef}\n\\ks ${bassKey}\n\\tuning (${bassTuningReverse})\n.\n:4 ${bassAlphaTexContent}`;
  document.getElementById('outBassAlphaTex').value = fullBassAlphaTex;
  try { apiBass.tex(fullBassAlphaTex); } catch(e) {}

  // 4. Calculs Ukulélé & ABC
  // 4. Calculs Ukulélé & ABC
  const ukuTuningReverse = [...ukuTuningStr].reverse().join(' ');
  const ukuAlphaTexNotes = [];
  const abcNotesArray = [];

  midiNotes.forEach(midiOriginal => {
    const midiTransposed = midiOriginal + octaveShift;
    
    // 1. ABCjs conserve la hauteur standard
    abcNotesArray.push(midiToAbc(midiTransposed));

    // 2. AlphaTab Ukulélé reçoit +1 octave (+12 demi-tons) 
    // pour aligner sa portée visuelle sur ABCjs
    const midiForAlphaTab = midiTransposed - 12;

    let bestString = 1;
    let bestFret = 99;

    for (let i = 0; i < ukuTuning.length; i++) {
      const openMidi = ukuTuning[i];
      const fret = midiForAlphaTab - openMidi; // On utilise la valeur décalée pour alphaTab
      const stringNum = ukuTuning.length - i;
      if (fret >= 0 && fret < bestFret) {
        bestFret = fret;
        bestString = stringNum;
      }
    }

    if(bestFret !== 99) {
      ukuAlphaTexNotes.push(`${bestFret}.${bestString}`);
    }
  });

  // 5. Rendu AlphaTab Ukulélé
  const ukuAlphaTexContent = ukuAlphaTexNotes.length > 0 ? ukuAlphaTexNotes.join(" ") : "0.1";
  const fullUkuAlphaTex = `\\title "Ukulele Tab"\n\\clef ${ukuClef}\n\\ks ${key}\n\\tuning (${ukuTuningReverse})\n.\n:4 ${ukuAlphaTexContent}`;
  document.getElementById('outAlphaTex').value = fullUkuAlphaTex;
  try { apiUku.tex(fullUkuAlphaTex); } catch(e) {}

  // 6. Rendu ABCjs
  const abcBody = abcNotesArray.join(" ");
  const fullAbc = `X:1\nT: Transposed Bass Tab\nM:4/4\nL:1/4\nK:${key}\n${abcBody}`;
  document.getElementById('outAbc').value = fullAbc;

  const abcContainer = document.getElementById("abcRender");
  abcContainer.innerHTML = "";

  const visualObj = ABCJS.renderAbc("abcRender", fullAbc, { responsive: "resize" });

  if (ABCJS.synth.supportsAudio()) {
    document.getElementById("abcAudio").innerHTML = "";

    synthControl = new ABCJS.synth.SynthController();
    synthControl.load("#abcAudio", null, { 
      displayRestart: true, 
      displayPlay: true, 
      displayProgress: true, 
      displayWarp: false 
    });

    const createSynth = new ABCJS.synth.CreateSynth();
    createSynth.init({
      visualObj: visualObj[0],
      audioContext: new (window.AudioContext || window.webkitAudioContext)()
    }).then(() => {
      synthControl.setTune(visualObj[0], false, { chordsOff: true });
    }).catch(err => console.warn("Erreur Audio ABCJS:", err));
  }

  window.scrollTo(scrollX, scrollY);
}

function copyToClipboard(id) {
  const copyText = document.getElementById(id);
  copyText.select();
  navigator.clipboard.writeText(copyText.value);
}
</script>
