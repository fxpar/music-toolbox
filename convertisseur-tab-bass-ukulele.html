<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertisseur Bass vers Ukulele & ABC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.6.3/abcjs-audio.min.css">
  <style>
    .at-viewport { overflow: auto; background: #fff; border: 1px solid #ddd; border-radius: 4px; min-height: 140px; }
    #abcRender { background: #fff; border: 1px solid #ddd; border-radius: 4px; min-height: 120px; }
  </style>
</head>
<body class="bg-light p-4">
<div class="container-fluid">
  <h2 class="mb-4">Convertisseur Bass (AlphaTex) ➔ Ukulélé & ABC</h2>

  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card h-100 shadow-sm">
        <div class="card-header bg-primary text-white">Source : Basse</div>
        <div class="card-body">
          <label class="form-label">Accordage (Corde 4 à 1) :</label>
          <input type="text" id="bassTuning" class="form-control mb-2" value="E1,A1,D2,G2">
          
          <label class="form-label">Clé AlphaTex :</label>
          <select id="bassClef" class="form-select mb-2">
            <option value="F4" selected>Fa (F4)</option>
            <option value="G2">Sol (G2)</option>
          </select>

          <label class="form-label">Armature :</label>
          <select id="bassKeySignature" class="form-select">
            <option value="C" selected>Do Maj / La min (C)</option>
            <option value="G">Sol Maj (1#)</option>
            <option value="D">Ré Maj (2#)</option>
            <option value="F">Fa Maj (1b)</option>
            <option value="Bb">Si bémol Maj (2b)</option>
            <option value="Eb">Mi bémol Maj (3b)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card h-100 shadow-sm">
        <div class="card-header bg-success text-white">Destination : Ukulélé</div>
        <div class="card-body">
          <label class="form-label">Accordage (Corde 4 à 1) :</label>
          <input type="text" id="ukuTuning" class="form-control mb-2" value="G3,C3,E3,A3">
          
          <label class="form-label">Clé AlphaTex :</label>
          <select id="ukuClef" class="form-select">
            <option value="G2" selected>Sol (G2)</option>
            <option value="F4">Fa (F4)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card h-100 shadow-sm">
        <div class="card-header bg-warning text-dark">Transposition Ukulélé</div>
        <div class="card-body">
          <label class="form-label">Décalage d'octave :</label>
          <select id="octaveShift" class="form-select">
            <option value="12" selected>+1 Octave (+12 demi-tons)</option>
            <option value="24" >+2 Octaves (+24 demi-tons)</option>
            <option value="36">+3 Octaves (+36 semi-tons)</option>
            <option value="0">Aucun (+0)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card h-100 shadow-sm">
        <div class="card-header bg-secondary text-white">Tonalité ABC & Contrôles</div>
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <label class="form-label">Armature ABC (Key) :</label>
            <select id="keySignature" class="form-select mb-3">
              <option value="C" selected>Do Maj / La min (C)</option>
              <option value="G">Sol Maj (1#)</option>
              <option value="D">Ré Maj (2#)</option>
              <option value="F">Fa Maj (1b)</option>
              <option value="Bb">Si bémol Maj (2b)</option>
              <option value="Eb">Mi bémol Maj (3b)</option>
            </select>
          </div>
          <button id="btnConvert" class="btn btn-primary w-100">Actualiser & Rendre</button>
        </div>
      </div>
    </div>
  </div>

    <div class="mb-4">
    <label class="form-label fw-bold">Entrée Riff Basse (Format: 12.3 0.4 2.2 ...)</label>
    <textarea id="inputBassTab" class="form-control" rows="2">12.1 10.2 12.1 10.2 13.1 12</textarea>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <span>Rendu Basse (Source)</span>
      <button class="btn btn-sm btn-light" onclick="copyToClipboard('outBassAlphaTex')">Copier AlphaTex Basse</button>
    </div>
    <div class="card-body">
      <textarea id="outBassAlphaTex" class="form-control mb-2 d-none" rows="2" readonly></textarea>
      <div class="mb-2">
        <button id="playBassAlphaTab" class="btn btn-sm btn-success">▶ Jouer Basse</button>
        <button id="stopBassAlphaTab" class="btn btn-sm btn-danger">■ Stopper</button>
      </div>
      <div id="alphaTabBassRender" class="at-viewport"></div>
    </div>
  </div>
  


  <div class="row g-4">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <span>Sortie AlphaTex (Ukulélé)</span>
          <button class="btn btn-sm btn-light" onclick="copyToClipboard('outAlphaTex')">Copier</button>
        </div>
        <div class="card-body">
          <textarea id="outAlphaTex" class="form-control mb-3" rows="3" readonly></textarea>
          <div class="mb-2">
            <button id="playAlphaTab" class="btn btn-sm btn-success">▶ Jouer Ukulélé</button>
            <button id="stopAlphaTab" class="btn btn-sm btn-danger">■ Stopper</button>
          </div>
          <div id="alphaTabRender" class="at-viewport"></div>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <span>Sortie Notation ABC</span>
          <button class="btn btn-sm btn-light" onclick="copyToClipboard('outAbc')">Copier</button>
        </div>
        <div class="card-body">
          <textarea id="outAbc" class="form-control mb-3" rows="3" readonly></textarea>
          <div id="abcAudio" class="mb-3"></div>
          <div id="abcRender" class="p-2"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const ABC_NOTES = ["C", "^C", "D", "^D", "E", "F", "^F", "G", "^G", "A", "^A", "B"];

// Conversion stricte Note -> Pitch MIDI
function noteToMidi(noteStr) {
  const match = noteStr.trim().match(/^([A-G][#b]?)(-?\d+)$/i);
  if (!match) return 60;
  let [, name, oct] = match;
  name = name.toUpperCase();
  let alter = 0;
  if (name.length > 1) {
    alter = name[1] === '#' ? 1 : -1;
    name = name[0];
  }
  const baseMap = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  return (parseInt(oct) + 1) * 12 + baseMap[name] + alter;
}

// Conversion stricte Pitch MIDI -> Notation ABC
function midiToAbc(midi) {
  const noteIdx = (midi % 12 + 12) % 12;
  const octave = Math.floor(midi / 12) - 1;
  let letter = ABC_NOTES[noteIdx];

  if (octave >= 5) {
    letter = letter.toLowerCase();
    if (octave > 5) letter += "'".repeat(octave - 5);
  } else if (octave < 4) {
    letter += ",".repeat(4 - octave);
  }
  return letter;
}

let apiUku = null;
let apiBass = null;
let synthControl = null;

document.addEventListener("DOMContentLoaded", () => {
  const soundFontUrl = 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/soundfont/sonivox.sf2';

  apiBass = new alphaTab.AlphaTabApi(document.getElementById('alphaTabBassRender'), {
    core: { engine: 'svg' },
    player: { enablePlayer: true, soundFont: soundFontUrl }
  });
  document.getElementById('playBassAlphaTab').onclick = () => apiBass.playPause();
  document.getElementById('stopBassAlphaTab').onclick = () => apiBass.stop();

  apiUku = new alphaTab.AlphaTabApi(document.getElementById('alphaTabRender'), {
    core: { engine: 'svg' },
    player: { enablePlayer: true, soundFont: soundFontUrl }
  });
  document.getElementById('playAlphaTab').onclick = () => apiUku.playPause();
  document.getElementById('stopAlphaTab').onclick = () => apiUku.stop();

  document.getElementById('btnConvert').onclick = processConversion;
  document.getElementById('inputBassTab').oninput = processConversion;
  document.getElementById('octaveShift').onchange = processConversion;
  document.getElementById('bassKeySignature').onchange = processConversion;
  document.getElementById('keySignature').onchange = processConversion;

  processConversion();
});

function processConversion() {
  const scrollX = window.scrollX;
  const scrollY = window.scrollY;

  // 1. Inputs
  const bassTuningStr = document.getElementById('bassTuning').value.split(',').map(s => s.trim());
  const bassTuning    = bassTuningStr.map(s => noteToMidi(s));
  
  const ukuTuningStr  = document.getElementById('ukuTuning').value.split(',').map(s => s.trim());
  const ukuTuning     = ukuTuningStr.map(s => noteToMidi(s));

  const inputTokens   = document.getElementById('inputBassTab').value.trim().split(/\s+/);
  const key           = document.getElementById('keySignature').value;
  const bassKey       = document.getElementById('bassKeySignature').value;
  const ukuClef       = document.getElementById('ukuClef').value;
  const bassClef      = document.getElementById('bassClef').value;
  const octaveShift   = parseInt(document.getElementById('octaveShift').value);

  const midiNotes = [];
  const bassAlphaTexNotes = [];

  // 2. Traitement entrée "frette.corde"
  inputTokens.forEach(token => {
    if(!token.includes('.')) return;
    const parts = token.split('.');
    const fret = parseInt(parts[0]);
    const stringNum = parseInt(parts[1]);
    
    if (isNaN(fret) || isNaN(stringNum)) return;

    // Indexation : 1 = Corde la plus aiguë
    const stringIdx = bassTuning.length - stringNum;
    if(bassTuning[stringIdx] !== undefined) {
      midiNotes.push(bassTuning[stringIdx] + fret);
      bassAlphaTexNotes.push(`${fret}.${stringNum}`);
    }
  });

  // 3. Rendu AlphaTab Basse (Noms de notes conservés pour \tuning)
  const bassTuningReverse = [...bassTuningStr].reverse().join(' ');
  const bassAlphaTexContent = bassAlphaTexNotes.length > 0 ? bassAlphaTexNotes.join(" ") : "0.1";
  const fullBassAlphaTex = `\\title "Bass Tab"\n\\clef ${bassClef}\n\\ks ${bassKey}\n\\tuning (${bassTuningReverse})\n.\n:4 ${bassAlphaTexContent}`;
  document.getElementById('outBassAlphaTex').value = fullBassAlphaTex;
  try { apiBass.tex(fullBassAlphaTex); } catch(e) {}

  // 4. Calculs Ukulélé & ABC
  // 4. Calculs Ukulélé & ABC
  const ukuTuningReverse = [...ukuTuningStr].reverse().join(' ');
  const ukuAlphaTexNotes = [];
  const abcNotesArray = [];

  midiNotes.forEach(midiOriginal => {
    const midiTransposed = midiOriginal + octaveShift;
    
    // 1. ABCjs conserve la hauteur standard
    abcNotesArray.push(midiToAbc(midiTransposed));

    // 2. AlphaTab Ukulélé reçoit +1 octave (+12 demi-tons) 
    // pour aligner sa portée visuelle sur ABCjs
    const midiForAlphaTab = midiTransposed - 12;

    let bestString = 1;
    let bestFret = 99;

    for (let i = 0; i < ukuTuning.length; i++) {
      const openMidi = ukuTuning[i];
      const fret = midiForAlphaTab - openMidi; // On utilise la valeur décalée pour alphaTab
      const stringNum = ukuTuning.length - i;
      if (fret >= 0 && fret < bestFret) {
        bestFret = fret;
        bestString = stringNum;
      }
    }

    if(bestFret !== 99) {
      ukuAlphaTexNotes.push(`${bestFret}.${bestString}`);
    }
  });

  // 5. Rendu AlphaTab Ukulélé
  const ukuAlphaTexContent = ukuAlphaTexNotes.length > 0 ? ukuAlphaTexNotes.join(" ") : "0.1";
  const fullUkuAlphaTex = `\\title "Ukulele Tab"\n\\clef ${ukuClef}\n\\ks ${key}\n\\tuning (${ukuTuningReverse})\n.\n:4 ${ukuAlphaTexContent}`;
  document.getElementById('outAlphaTex').value = fullUkuAlphaTex;
  try { apiUku.tex(fullUkuAlphaTex); } catch(e) {}

  // 6. Rendu ABCjs
  const abcBody = abcNotesArray.join(" ");
  const fullAbc = `X:1\nT: Transposed Bass Tab\nM:4/4\nL:1/4\nK:${key}\n${abcBody}`;
  document.getElementById('outAbc').value = fullAbc;

  const abcContainer = document.getElementById("abcRender");
  abcContainer.innerHTML = "";

  const visualObj = ABCJS.renderAbc("abcRender", fullAbc, { responsive: "resize" });

  if (ABCJS.synth.supportsAudio()) {
    document.getElementById("abcAudio").innerHTML = "";

    synthControl = new ABCJS.synth.SynthController();
    synthControl.load("#abcAudio", null, { 
      displayRestart: true, 
      displayPlay: true, 
      displayProgress: true, 
      displayWarp: false 
    });

    const createSynth = new ABCJS.synth.CreateSynth();
    createSynth.init({
      visualObj: visualObj[0],
      audioContext: new (window.AudioContext || window.webkitAudioContext)()
    }).then(() => {
      synthControl.setTune(visualObj[0], false, { chordsOff: true });
    }).catch(err => console.warn("Erreur Audio ABCJS:", err));
  }

  window.scrollTo(scrollX, scrollY);
}

function copyToClipboard(id) {
  const copyText = document.getElementById(id);
  copyText.select();
  navigator.clipboard.writeText(copyText.value);
}
</script>
</body>
</html>
