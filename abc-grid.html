<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Générateur de Grille ABCJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.6.3/abcjs-audio.min.css">
    <script src="./js/i18n-fx.js"></script>
    <style>
        .abc-paper {
            background: transparent;
            padding: 10px;
        }
        /* Intégration du player abcjs */
        .abcjs-audio .abcjs-btn {
            background-color: var(--bs-primary) !important;
            color: white !important;
            border-radius: 4px;
        }
        .abcjs-audio {
            border-radius: var(--bs-border-radius);
            background: var(--bs-secondary-bg);
            border: 1px solid var(--bs-border-color);
        }
        
        /* --- Styles du Curseur SVG et de la surbrillance --- */
        .abcjs-cursor {
            stroke: rgba(220, 53, 69, 0.75);
            stroke-width: 2.5px;
        }
        .abcjs-highlight {
            fill: rgba(220, 53, 69, 0.2) !important;
        }
    </style>
  <!-- Zone sûre (encoche / barre d'état), nécessite viewport-fit=cover. Ignoré par les vieux navigateurs. -->
  <style id="fx-safe-area">
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .offcanvas-start, .offcanvas-end {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);

<body class="bg-body-tertiary min-vh-100 d-flex flex-column">

        <div class="container-fluid">

                <i class="bi bi-sun-fill" id="themeIcon"></i>
            </button>

    <div class="container my-2 flex-grow-1">
        <div class="row g-4">
            
            <div class="col-lg-5">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="card-title mb-0"><i class="bi bi-sliders me-2"></i><span data-i18n="ui.config">Configuration</span></h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="chordGrid" class="form-label fw-bold" data-i18n="ui.grid">Votre grille d'accords :</label>
                            <textarea class="form-control font-monospace" id="chordGrid" rows="3" placeholder="Ex: C /// G // C7 // Am" data-i18n-placeholder="ui.gridPh"></textarea>
                            <div class="form-text" data-i18n-html="ui.gridHelp">Séparez par des espaces. Utilisez <code>/</code> pour répéter la mesure.</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="gchordStyle" class="form-label fw-bold" data-i18n="ui.style">Style :</label>
                                <select class="form-select" id="gchordStyle">
                                    <option value="zczczczc">Boom Chick (Standard)</option>
                                    <option value="bzzcbzcz">Tango</option>
                                    <option value="GIGIGJHJ" data-i18n="ui.arpeggio">Arpège</option>
                                    <option value="zzzz" data-i18n="ui.silent">Silencieux</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label for="timeSignature" class="form-label fw-bold" data-i18n="ui.timeSig">Mesure :</label>
                                <select class="form-select" id="timeSignature">
                                    <option value="4/4" selected>4/4</option>
                                    <option value="3/4">3/4</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-grid gap-2 pt-2">
                            <button class="btn btn-success btn-lg" onclick="generateABC()">
                                <i class="bi bi-play-circle-fill me-2"></i><span data-i18n="ui.generate">Appliquer & Générer</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-secondary text-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0"><i class="bi bi-eye me-2"></i><span data-i18n="ui.render">Rendu</span></h5>
                        <button class="btn btn-sm btn-light" type="button" data-bs-toggle="collapse" data-bs-target="#abcCodeCollapse" data-i18n="ui.abcCode">
                            Code ABC
                        </button>
                    </div>
                    <div class="card-body d-flex flex-column">
                        
                        <div class="collapse mb-3" id="abcCodeCollapse">
                            <textarea class="form-control font-monospace bg-body-secondary small" id="abcSource" rows="4" readonly></textarea>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex align-items-stretch gap-1">
                                <div id="audio-player" class="flex-grow-1"></div>
                                <button class="btn btn-secondary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#moreControls" title="Plus d'options" data-i18n-title="ui.more">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                            </div>
                            
                            <div class="collapse border border-top-0 rounded-bottom p-3 bg-body-secondary" id="moreControls">
                                <div class="row g-3 align-items-end">
                                    <div class="col-auto">
                                        <label for="abc-sel-transpose" class="form-label small fw-bold" data-i18n="ui.transpose">Transposer (demi-tons) :</label>
                                        <select id="abc-sel-transpose" class="form-select form-select-sm" style="width: 120px;">
                                            <option value="0" selected data-i18n="ui.default0">0 (Défaut)</option>
                                            <option value="1">+1</option>
                                            <option value="2">+2</option>
                                            <option value="3">+3</option>
                                            <option value="4">+4</option>
                                            <option value="5">+5</option>
                                            <option value="6">+6</option>
                                            <option value="7">+7</option>
                                            <option value="8">+8</option>
                                            <option value="-1">-1</option>
                                            <option value="-2">-2</option>
                                            <option value="-3">-3</option>
                                            <option value="-4">-4</option>
                                            <option value="-5">-5</option>
                                            <option value="-6">-6</option>
                                            <option value="-7">-7</option>
                                            <option value="-8">-8</option>
                                        </select>
                                    </div>
                                    <div class="col-auto">
                                        <button class="btn btn-primary btn-sm" onclick="generateABC()" data-i18n="ui.apply">Appliquer</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="flex-grow-1 border rounded p-2 bg-card d-flex align-items-center justify-content-center">
                            <div id="paper" class="w-100 abc-paper"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.0/dist/abcjs-basic-min.js"></script>

    <script>
        // --- Traductions FR / EN (module commun js/i18n-fx.js) ---
        FxI18n.add({
            fr: {
                "page.title": "Générateur de Grille ABCJS",
                "ui.brand": "Grille-To-ABC Editor", "ui.theme": "Mode jour / nuit", "ui.config": "Configuration",
                "ui.grid": "Votre grille d'accords :", "ui.gridPh": "Ex: C /// G // C7 // Am",
                "ui.gridHelp": "Séparez par des espaces. Utilisez <code>/</code> pour répéter la mesure.",
                "ui.style": "Style :", "ui.arpeggio": "Arpège", "ui.silent": "Silencieux", "ui.timeSig": "Mesure :",
                "ui.generate": "Appliquer & Générer", "ui.render": "Rendu", "ui.abcCode": "Code ABC", "ui.more": "Plus d'options",
                "ui.transpose": "Transposer (demi-tons) :", "ui.default0": "0 (Défaut)", "ui.apply": "Appliquer",
                "abc.title": "Grille Rythmique", "msg.noAudio": "L'audio n'est pas supporté.",
                "footer.tagline": "Créé avec passion pour le rythme et la mélodie.", "footer.github": "Code source GitHub",
                "footer.linkedin": "LinkedIn: François Parlant", "footer.youtube": "Tutos YouTube: En parlant de bureautique"
            },
            en: {
                "page.title": "ABCJS Chord Grid Generator",
                "ui.brand": "Grid-to-ABC Editor", "ui.theme": "Light / dark mode", "ui.config": "Settings",
                "ui.grid": "Your chord grid:", "ui.gridPh": "e.g. C /// G // C7 // Am",
                "ui.gridHelp": "Separate with spaces. Use <code>/</code> to repeat the bar.",
                "ui.style": "Style:", "ui.arpeggio": "Arpeggio", "ui.silent": "Silent", "ui.timeSig": "Time signature:",
                "ui.generate": "Apply & Generate", "ui.render": "Output", "ui.abcCode": "ABC code", "ui.more": "More options",
                "ui.transpose": "Transpose (semitones):", "ui.default0": "0 (Default)", "ui.apply": "Apply",
                "abc.title": "Rhythm Grid", "msg.noAudio": "Audio is not supported.",
                "footer.tagline": "Made with passion for rhythm and melody.", "footer.github": "Source code on GitHub",
                "footer.linkedin": "LinkedIn: François Parlant", "footer.youtube": "YouTube tutorials: En parlant de bureautique"
            }
        });
        FxI18n.onChange(function () {
            document.title = FxI18n.t("page.title");
        });

        document.getElementById('chordGrid').value = "C /// G // C7 // Am";

        let synthControl = null;

        // --- GESTIONNAIRE DU CURSEUR AUDIO (Intégration de votre modèle fonctionnel) ---
        function CursorControl() {
            var self = this;
            self.onStart = function() {
                var svg = document.querySelector("#paper svg");
                if (!svg) return;
                var cursor = document.createElementNS("http://www.w3.org/2000/svg", "line");
                cursor.setAttribute("class", "abcjs-cursor");
                cursor.setAttributeNS(null, 'x1', "0");
                cursor.setAttributeNS(null, 'y1', "0");
                cursor.setAttributeNS(null, 'x2', "0");
                cursor.setAttributeNS(null, 'y2', "0");
                svg.appendChild(cursor);
            };
            self.onEvent = function(ev) {
                if (ev.measureStart && ev.left === null) return;
                
                // Nettoyage de l'ancienne surbrillance
                document.querySelectorAll("#paper svg .abcjs-highlight").forEach(el => el.classList.remove("abcjs-highlight"));
                
                // Application de la nouvelle surbrillance
                if (ev.elements) {
                    for (var i = 0; i < ev.elements.length; i++) {
                        var note = ev.elements[i];
                        for (var j = 0; j < note.length; j++) {
                            note[j].classList.add("abcjs-highlight");
                        }
                    }
                }
                
                // Déplacement de la ligne rouge du curseur
                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor && ev.left !== null) {
                    cursor.setAttributeNS(null, 'x1', (ev.left - 2).toString());
                    cursor.setAttributeNS(null, 'x2', (ev.left - 2).toString());
                    cursor.setAttributeNS(null, 'y1', ev.top.toString());
                    cursor.setAttributeNS(null, 'y2', (ev.top + ev.height).toString());
                }
            };
            self.onFinished = function() {
                document.querySelectorAll("#paper svg .abcjs-highlight").forEach(el => el.classList.remove("abcjs-highlight"));
                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor) { 
                    cursor.setAttributeNS(null, 'x1', "0"); 
                    cursor.setAttributeNS(null, 'x2', "0"); 
                }
            };
        }
        const cursorControl = new CursorControl();

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            
            const btn = document.getElementById('themeToggleBtn');
            if (newTheme === 'dark') {
                btn.innerHTML = '<i class="bi bi-sun-fill"></i>';
            } else {
                btn.innerHTML = '<i class="bi bi-moon-fill"></i>';
            }
        }

        function generateABC() {
            if (synthControl) {
                synthControl.pause();
                synthControl = null;
            }

            const gridText = document.getElementById('chordGrid').value.trim();
            const gchord = document.getElementById('gchordStyle').value;
            const timeSig = document.getElementById('timeSignature').value;
            const transposeValue = parseInt(document.getElementById('abc-sel-transpose').value, 10) || 0;
            
            const tokens = gridText.replace(/\|/g, ' ').split(/\s+/).filter(t => t.length > 0);
            
            let abcMeasures = [];
            let lastChord = "C"; 
            const beatsPerMeasure = timeSig === "3/4" ? 3 : 4;
            const rests = " z".repeat(beatsPerMeasure).trim();

            tokens.forEach(token => {
                if (token === "/" || token === "///" || token === "//") {
                    const count = token.length;
                    for(let i=0; i<count; i++) {
                        abcMeasures.push(`"${lastChord}" ${rests}`);
                    }
                } else {
                    lastChord = token;
                    abcMeasures.push(`"${lastChord}" ${rests}`);
                }
            });

            let formattedMeasures = "";
            for (let i = 0; i < abcMeasures.length; i++) {
                formattedMeasures += abcMeasures[i] + " | ";
                if ((i + 1) % 4 === 0 && i !== abcMeasures.length - 1) {
                    formattedMeasures += "\n ";
                }
            }

            // Utilisation combinée de %%MIDI transpose pour l'audio gchord
            const abcString = `X:1\nT:${FxI18n.t("abc.title")}\nM:${timeSig}\nL:1/4\nQ:100\nK:C\n%%MIDI transpose ${transposeValue}\n%%MIDI gchord ${gchord}\n${formattedMeasures}`;
            document.getElementById('abcSource').value = abcString;

            const renderOptions = { 
                responsive: "resize",
                add_classes: true,
                visualTranspose: transposeValue
            };

            // 1. Rendu Visuel
            const visualObj = ABCJS.renderAbc("paper", abcString, renderOptions)[0];

            // 2. Rendu Audio (Liaison robuste via le paramètre cursorControl officiel d'abcjs)
            if (ABCJS.synth.supportsAudio()) {
                const audioOptions = {
                    displayLoop: true,
                    displayRestart: true,
                    displayPlay: true,
                    displayProgress: true,
                    displayWarp: true,
                    midiTranspose: transposeValue
                };
                
                synthControl = new ABCJS.synth.SynthController();
                // Ici, on injecte 'cursorControl' directement en deuxième argument
                synthControl.load("#audio-player", cursorControl, audioOptions);

                const createSynth = new ABCJS.synth.CreateSynth();
                createSynth.init({ visualObj: visualObj }).then(function () {
                    synthControl.setTune(visualObj, false).then(function () {
                        console.log("Lecteur audio et curseur synchronisés.");
                    }).catch(function (error) {
                        console.warn("Erreur d'initialisation du morceau :", error);
                    });
                }).catch(function (error) {
                    console.warn("Erreur de création de la synthèse audio :", error);
                });
            } else {
                document.getElementById("audio-player").innerHTML = "<div class='alert alert-warning p-2 small'>" + FxI18n.t("msg.noAudio") + "</div>";
            }
        }

        window.onload = function() {
            generateABC();
        };
    </script>
