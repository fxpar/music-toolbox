<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChordFlow - Lecteur de Chansons</title>
    <link rel="stylesheet" href="./css/songbookfx.css">
  <!-- Zone sûre (encoche / barre d'état), nécessite viewport-fit=cover. Ignoré par les vieux navigateurs. -->
  <style id="fx-safe-area">
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .offcanvas-start, .offcanvas-end {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body>

    <header class="top-bar">
        <div class="header-left">
            <button id="menu-toggle" title="Menu" data-i18n-title="sb.menu">☰</button>
            <div class="logo">ChordFlow</div>
        </div>

        <div class="transpose-controls">
            <button id="transpose-down" title="Baisser d'un demi-ton" data-i18n-title="sb.down">➖</button>
            <span id="transpose-val">Ton : 0</span>
            <button id="transpose-up" title="Monter d'un demi-ton" data-i18n-title="sb.up">➕</button>
        </div>

        <div class="header-actions">
            
            <button type="button" data-i18n-toggle>FR</button>
            <button id="options-toggle" title="Paramètres" data-i18n-title="sb.settings">⚙️</button>
        </div>
    </header>

    <main class="main-container">
        <aside class="sidebar">
            <div class="search-section">
                <input type="text" id="search-bar" placeholder="🔍 Rechercher..." data-i18n-placeholder="sb.search">
                <button id="clear-search" title="Effacer la recherche" data-i18n-title="sb.clearSearch">✕</button>
            </div>
			

				<!-- NOUVEAU BOUTON -->
				<button id="import-btn" class="btn-primary-add" data-i18n="sb.addSongBtn">➕ Ajouter une chanson</button>




            <ul id="song-list"></ul>
        </aside>

        <section class="song-view">
            <div id="song-metadata">
                <h1 id="display-title">Titre de la chanson</h1>
                <h2 id="display-author">Artiste</h2>
            </div>
            <div id="song-content"></div>
        </section>

        <div id="chord-resizer" class="resizer-v"></div>

        <aside class="chord-panel">
            <div class="instrument-box">
                <select id="instrument-select">
                    <option value="guitare" data-i18n="sb.guitar">🎸 Guitare</option>
                    <option value="ukulele" selected data-i18n="sb.ukulele">🏝️ Ukulélé</option>
                    <option value="piano">🎹 Piano</option>
                </select>
                <div class="zoom-controls">
                    <button id="diagram-zoom-down" title="Rétrécir" data-i18n-title="sb.zoomOut">🔍-</button>
                    <button id="diagram-zoom-up" title="Agrandir" data-i18n-title="sb.zoomIn">🔍+</button>
                </div>
            </div>
            <div id="chord-diagrams-container"></div>
        </aside>
    </main>

    <div id="options-panel" class="side-panel">
        <div class="panel-header">
            <h3 data-i18n="sb.settings">Paramètres</h3>
            <button id="close-options" title="Fermer" data-i18n-title="sb.close">✕</button>
        </div>
        <div class="panel-body">
            <div class="setting-row">
                <label data-i18n="sb.theme">Thème</label>
                <button id="theme-toggle" class="btn-full">🌙 Mode Nuit</button>
            </div>
            <div class="setting-row">
                <label data-i18n="sb.lyricsSize">Taille paroles</label>
                <div class="btn-group">
                    <button id="lyrics-size-down">A-</button>
                    <span id="lyrics-size-val">1.1rem</span>
                    <button id="lyrics-size-up">A+</button>
                </div>
            </div>
            <div class="setting-row">
                <label data-i18n="sb.chordSize">Taille accords</label>
                <div class="btn-group">
                    <button id="chord-size-down">a-</button>
                    <span id="chord-size-val">0.9rem</span>
                    <button id="chord-size-up">a+</button>
                </div>
            </div>
			<!-- <div class="setting-row"> -->
                <!-- <label>Importer</label> -->
                <!-- <button id="import-btn" class="btn-full">📥 Importer</button> -->
            <!-- </div> -->
        </div>
    </div>

    <div id="import-modal" class="modal">
        <div class="modal-content">
            <h3 data-i18n="sb.addSong">Ajouter une chanson</h3>
            <textarea id="import-text" placeholder="Collez votre texte ici (Format ChordPro : [Am]Titre...)" data-i18n-placeholder="sb.pastePh"></textarea>
            <div class="modal-actions">
                <button id="save-song" data-i18n="sb.save">Enregistrer</button>
                <button id="close-modal" data-i18n="sb.cancel">Annuler</button>
            </div>
        </div>
    </div>

    <script src="./js/i18n-fx.js"></script>
    <script src="./js/songbookfx-chords.js"></script>
    <script src="./js/songbookfx-songs_data.js"></script>
    <script src="./js/songbookfx-parser.js"></script>
    <script src="./js/songbookfx-transposer.js"></script>
    <script src="./js/uke-chord3fx.js"></script>
    <script src="./js/songbookfx.js"></script>

</body>
</html>
