<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ukulele Intervals & Shape Trainer - MD3</title>
  <style>
    /* ==========================================================================
       1. MATERIAL DESIGN 3 DESIGN TOKENS (LIGHT / DARK)
       ========================================================================== */
    :root[data-theme="dark"] {
      --md-sys-color-background: #141218;
      --md-sys-color-on-background: #e6e0e9;
      --md-sys-color-surface: #141218;
      --md-sys-color-surface-container: #211f26;
      --md-sys-color-surface-container-high: #2b2930;
      --md-sys-color-on-surface: #e6e0e9;
      --md-sys-color-on-surface-variant: #cac4d0;
      --md-sys-color-primary: #d0bcff;
      --md-sys-color-on-primary: #381e72;
      --md-sys-color-primary-container: #4f378b;
      --md-sys-color-on-primary-container: #eaddff;
      --md-sys-color-secondary: #ccc2dc;
      --md-sys-color-on-secondary: #332d41;
      --md-sys-color-outline: #938f99;
      --md-sys-color-outline-variant: #49454f;
      
      --chord-root: #ffb4ab;
      --chord-root-text: #690005;
      --chord-interval: #a8c7ff;
      --chord-interval-text: #003062;
      --chord-error: #ffb4ab;
      
      --fretboard-wood: #231f20;
      --fret-wire: #49454f;
      --string-color: #e6e0e9;
    }

    :root[data-theme="light"] {
      --md-sys-color-background: #fef7ff;
      --md-sys-color-on-background: #1d1b20;
      --md-sys-color-surface: #fef7ff;
      --md-sys-color-surface-container: #f3edf7;
      --md-sys-color-surface-container-high: #ece6f0;
      --md-sys-color-on-surface: #1d1b20;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-primary: #6750a4;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #eaddff;
      --md-sys-color-on-primary-container: #21005d;
      --md-sys-color-secondary: #625b71;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-outline: #79747e;
      --md-sys-color-outline-variant: #c9c5d0;

      --chord-root: #ba1a1a;
      --chord-root-text: #ffffff;
      --chord-interval: #0061a4;
      --chord-interval-text: #ffffff;
      --chord-error: #ba1a1a;

      --fretboard-wood: #4a3e3d;
      --fret-wire: #938f99;
      --string-color: #1d1b20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ==========================================================================
       2. HEADER & NAVIGATION (FIXED TOP APP BAR & DRAWER)
       ========================================================================== */
    .top-bar {
      height: 72px;
      background-color: var(--md-sys-color-surface-container);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 10;
      flex-shrink: 0;
    }

    .top-bar .title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
    }

    .top-bar h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--md-sys-color-primary);
    }

    .top-bar .instruction {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      margin-top: 2px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--md-sys-color-on-surface);
      font-size: 1.4rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active {
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* Navigation Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: -300px;
      width: 280px;
      background-color: var(--md-sys-color-surface-container-high);
      z-index: 101;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.3s ease;
      border-radius: 0 16px 16px 0;
    }

    .drawer-overlay.open .drawer {
      transform: translateX(300px);
    }

    .drawer h2 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: var(--md-sys-color-on-surface);
    }

    .menu-item {
      padding: 12px 16px;
      border-radius: 28px;
      background-color: transparent;
      color: var(--md-sys-color-on-surface-variant);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-weight: 500;
    }

    .menu-item.active {

      color: var(--md-sys-color-on-primary-container);
    }

    /* ==========================================================================
       3. INTERVAL MATRIX FRETBOARD (SCROLLABLE & INFINITE LOOP)
       ========================================================================== */
    .fretboard-viewport {
      flex: 1;
      overflow-y: auto;
      position: relative;
      background-color: var(--fretboard-wood);
      display: flex;
      justify-content: center;
      padding-bottom: 180px; /* Leave space for bottom sheet */

    .fretboard {
      width: 100%;
      max-width: 380px;
      position: relative;
      display: flex;
      flex-direction: column;
      <!-- box-shadow: 0 0 25px rgba(0,0,0,0.6); -->

    .string-header {
      position: sticky;
      top: 0;
      background-color: var(--md-sys-color-surface-container-high);
      display: flex;
      justify-content: space-around;

      font-weight: bold;
      color: var(--md-sys-color-primary);
      z-index: 5;
      border-bottom: 2px solid var(--md-sys-color-outline-variant);
      font-size: 0.85rem;
    }

    .strings-container {
      position: absolute;
      top: 36px;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
      z-index: 2;
    }

    .string-line {
	display:none;
      width: 2px;
      background-color: var(--string-color);
      height: 100%;
      box-shadow: 1px 0 3px rgba(0,0,0,0.5);
    }
    .string-line:nth-child(2) { width: 3.2px; } /* C string */
    .string-line:nth-child(3) { width: 2.5px; } /* E string */

    .fret-row {
  height: 75px;
  min-height: 75px; /*  AJOUTER : Empêche la compression sur vieux WebViews */
  flex-shrink: 0;   /*  AJOUTER : Force le conteneur à déborder et à scroller */
  border-bottom: 3px solid var(--fret-wire);
  position: relative;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 3;
}

    .note-spot {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s;
      z-index: 4;
      font-weight: 700;
      font-size: 0.95rem;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: transparent;
    }

    .note-spot.active {
      background-color: var(--chord-interval);
      color: var(--chord-interval-text);
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      border: none;

    .note-spot.active.root {
      background-color: var(--chord-root);

      box-shadow: 0 0 12px var(--chord-root);
    }

    .note-spot.correct-solution {
      border: 2px dashed var(--md-sys-color-primary);
      background-color: rgba(208, 188, 255, 0.25);
      color: var(--md-sys-color-on-surface);
    }

    /* ==========================================================================
       4. BOTTOM SHEET & CONTROLS
       ========================================================================== */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--md-sys-color-surface-container-high);
      border-radius: 28px 28px 0 0;
      padding: 16px 20px 24px 20px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background-color: var(--md-sys-color-outline);
      border-radius: 2px;
      align-self: center;
    }

    .feedback-text {
      font-size: 0.95rem;
      color: var(--md-sys-color-on-surface);
      text-align: center;
      min-height: 22px;
      font-weight: 500;
    }

    .hint-box {
      display: none;
      background-color: var(--md-sys-color-surface-container);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--md-sys-color-on-surface-variant);
      text-align: center;
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .actions-row {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .btn {
      flex: 1;
      height: 48px;
      border-radius: 24px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s ease, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-outlined {
      background-color: transparent;
      color: var(--md-sys-color-primary);
      border: 1px solid var(--md-sys-color-outline);
    }

    .btn-secondary {
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-primary);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .btn-primary {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    .score-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-size: 0.8rem;
      font-weight: bold;
    }
  </style>
</head>

  <script>
    /* ==========================================================================
       5. MATRIX & MUSIC THEORY DATA ENGINE
       ========================================================================== */
    // Strings order: [G, C, E, A]
    // Base semitones relative to Root C (C=0, E=4, G=7, A=9)
    const STRING_OFFSETS = [7, 0, 4, 9];
    const TOTAL_ROWS = 36; // 3 cycles of 12 semitones

    // Pitch Class to standard interval names
    const INTERVAL_MAP = {
      0:  { name: 'R',  alt: 'R' },
      1:  { name: 'b9', alt: 'b2' },
      2:  { name: '9',  alt: '2' },
      3:  { name: 'b3', alt: '#2' },
      4:  { name: '3',  alt: '3' },
      5:  { name: '4',  alt: '#11' },
      6:  { name: 'b5', alt: '#4' },
      7:  { name: '5',  alt: '5' },
      8:  { name: 'b6', alt: '#5' },
      9:  { name: '6',  alt: 'bb7' },
      10: { name: 'b7', alt: '#6' },
      11: { name: '7',  alt: 'maj7' }
    };

    // 1. DÉFINITION GLOBALE DES ACCORDS (Formules théoriques)
const CHORDS = {
  'Majeur':     { intervals: [0, 4, 7],     labels: {0:'R', 4:'3', 7:'5'},     hint: 'R - 3 - 5' },
  'Mineur':     { intervals: [0, 3, 7],     labels: {0:'R', 3:'b3', 7:'5'},    hint: 'R - b3 - 5' },
  '7 (Dom)':    { intervals: [0, 4, 7, 10], labels: {0:'R', 4:'3', 7:'5', 10:'b7'}, hint: 'R - 3 - 5 - b7' },
  'm7':         { intervals: [0, 3, 7, 10], labels: {0:'R', b3:'b3', 7:'5', 10:'b7'},hint: 'R - b3 - 5 - b7' },
  'maj7':       { intervals: [0, 4, 7, 11], labels: {0:'R', 4:'3', 7:'5', 11:'7'}, hint: 'R - 3 - 5 - 7' },
  'Diminué':    { intervals: [0, 3, 6],     labels: {0:'R', 3:'b3', 6:'b5'},   hint: 'R - b3 - b5' },
  'Augmenté':   { intervals: [0, 4, 8],     labels: {0:'R', 4:'3', 8:'#5'},    hint: 'R - 3 - #5' },
  'sus4':       { intervals: [0, 5, 7],     labels: {0:'R', 5:'4', 7:'5'},     hint: 'R - 4 - 5' }
};

let currentQuestion = null;

// Générateur de question aléatoire
// Générateur de question avec Racine sur N'IMPORTE QUELLE corde
function generateRandomQuestion() {
  const keys = Object.keys(CHORDS);
  const fromKey = keys[Math.floor(Math.random() * keys.length)];
  let toKey = fromKey;
  
  while (toKey === fromKey) {
    toKey = keys[Math.floor(Math.random() * keys.length)];
  }

  // 1. Choix aléatoire de la corde qui porte la racine (0=G, 1=C, 2=E, 3=A)
  const rootString = Math.floor(Math.random() * 4);
  const rootRow = 12; // On garde la ligne 12 au centre pour la lisibilité

  // 2. Génération de la forme initiale autour de cette racine
  const initialRows = generateValidShape(CHORDS[fromKey], rootRow, rootString);

  return {
    from: fromKey,
    to: toKey,
    rootRow: rootRow,
    rootString: rootString, // Dynamique !
    initialRows: initialRows
  };
}

// Génère une forme valide selon la corde de racine choisie
function generateValidShape(chordDef, rootRow, rootString) {
  const rootPitch = getPitchClass(rootRow, rootString);
  let shape = [0, 0, 0, 0];
  shape[rootString] = rootRow; // On fixe la racine sur la corde choisie

  // Pour les 3 autres cordes
  [0, 1, 2, 3].forEach(s => {
    if (s === rootString) return;

    let bestRow = rootRow;
    let minDiff = 99;
    
    // Cherche la case la plus proche (+/- 3 cases) qui contient une note de la formule
    for (let r = rootRow - 3; r <= rootRow + 3; r++) {
      const pitch = getPitchClass(r, s);
      const interval = (pitch - rootPitch + 12) % 12;
      if (chordDef.intervals.includes(interval)) {
        if (Math.abs(r - rootRow) < minDiff) {
          minDiff = Math.abs(r - rootRow);
          bestRow = r;
        }
      }
    }
    shape[s] = bestRow;
  });
  return shape;
}
    let currentQIdx = 0;
    let userState = [0, 0, 0, 0]; // Selected row per string [G, C, E, A]
    let score = 0;

    /* ==========================================================================
       6. DOM GENERATION & GAME LOGIC
       ========================================================================== */
    const fretboardEl = document.getElementById('fretboard');
    const viewportEl = document.getElementById('viewport');
    const instructionEl = document.getElementById('instruction-text');
    const feedbackEl = document.getElementById('feedback');
    const hintBoxEl = document.getElementById('hint-box');
    const btnValidate = document.getElementById('btn-validate');
    const btnCorrect = document.getElementById('btn-correct');
    const btnNext = document.getElementById('btn-next');
    const btnHint = document.getElementById('btn-hint');
    const totalScoreEl = document.getElementById('total-score');

    function getPitchClass(row, stringIdx) {
      return (STRING_OFFSETS[stringIdx] + row) % 12;
    }

    function buildMatrix() {
      for (let r = 0; r < TOTAL_ROWS; r++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'fret-row';
        rowEl.dataset.row = r;

        for (let s = 0; s < 4; s++) {
          const spot = document.createElement('div');
          spot.className = 'note-spot';
          spot.dataset.string = s;
          spot.dataset.row = r;

          spot.addEventListener('click', () => handleSpotClick(s, r));
          rowEl.appendChild(spot);
        }
        fretboardEl.appendChild(rowEl);
      }
    }

    function handleSpotClick(stringIdx, rowIdx) {
      // Exactly 1 note per string constraint
      userState[stringIdx] = rowIdx;
      renderState();
    }

    function renderState(showSolutions = false) {
  const q = currentQuestion;
  const rootRow = q.rootRow;
  const rootString = q.rootString; // Corde de C (index 1)
  const rootPitch = getPitchClass(rootRow, rootString);

  const spots = fretboardEl.querySelectorAll('.note-spot');
  spots.forEach(spot => {
    const s = parseInt(spot.dataset.string);
    const r = parseInt(spot.dataset.row);

    spot.classList.remove('active', 'root', 'correct-solution');
    spot.innerText = '';

    // Affichage des notes sélectionnées par l'utilisateur
    if (userState[s] === r) {
      spot.classList.add('active');
      
      const spotPitch = getPitchClass(r, s);
      const intervalVal = (spotPitch - rootPitch + 12) % 12;

      // Récupère le nom de l'intervalle selon la cible
      const targetChord = CHORDS[q.to];
      let label = targetChord.labels[intervalVal] || INTERVAL_MAP[intervalVal].name;
      spot.innerText = label;

      // REGLE 2 : Seule la Root figée (C-String à rootRow) a la couleur spéciale .root
      if (s === rootString && r === rootRow) {
        spot.classList.add('root');
      }
    }

    // Affichage d'une correction visuelle si demandée
    if (showSolutions) {
      const sol = generateValidShape(CHORDS[q.to], q.rootRow, q.rootString);
      if (sol[s] === r && userState[s] !== r) {
        spot.classList.add('correct-solution');
        const spotPitch = getPitchClass(r, s);
        const intervalVal = (spotPitch - rootPitch + 12) % 12;
        spot.innerText = CHORDS[q.to].labels[intervalVal] || INTERVAL_MAP[intervalVal].name;
      }
    }
  });
}

    function loadQuestion() {
  currentQuestion = generateRandomQuestion();
  instructionEl.innerText = `${currentQuestion.from} ➔ ${currentQuestion.to}`;
  userState = [...currentQuestion.initialRows];

  feedbackEl.innerText = "Déplacez les notes pour obtenir la forme cible.";
  feedbackEl.style.color = "var(--md-sys-color-on-surface)";
  hintBoxEl.style.display = "none";
  
  btnValidate.style.display = "inline-flex";
  btnNext.style.display = "none";

  renderState();
  centerViewportOnActiveChord();
}

// Mise à jour du bouton Suivant
btnNext.addEventListener('click', () => {
  loadQuestion();
});

    function centerViewportOnActiveChord() {
      const avgRow = Math.round(userState.reduce((a, b) => a + b, 0) / userState.length);
      const rowEl = fretboardEl.querySelector(`.fret-row[data-row="${avgRow}"]`);
      if (rowEl) {
        const scrollPos = rowEl.offsetTop - (viewportEl.clientHeight / 2) + 38;
        viewportEl.scrollTo({ top: Math.max(0, scrollPos), behavior: 'smooth' });
      }
    }

    /* ==========================================================================
       7. BUTTON HANDLERS & VALIDATION
       ========================================================================== */
    // Validation harmonique (Formule)
btnValidate.addEventListener('click', () => {
  const q = currentQuestion;
  const targetChord = CHORDS[q.to];
  const rootPitch = getPitchClass(q.rootRow, q.rootString);

  // 1. Vérifie si l'ancre Root a bougé
  if (userState[q.rootString] !== q.rootRow) {
    feedbackEl.innerText = "❌ La fondamentale principale ne doit pas être déplacée.";
    feedbackEl.style.color = "var(--chord-error)";
    return;
  }

  // 2. Extraire les intervalles joués sur les 4 cordes
  const playedIntervals = userState.map((r, s) => {
    const pitch = getPitchClass(r, s);
    return (pitch - rootPitch + 12) % 12;
  });

  // 3. Vérifier si TOUS les intervalles joués font partie de la formule cible
  const allNotesInFormula = playedIntervals.every(interval => 
    targetChord.intervals.includes(interval)
  );

  // 4. Vérifier que CHAQUE note obligatoire de la formule est présente au moins une fois
  const allRequiredNotesPresent = targetChord.intervals.every(requiredInterval => 
    playedIntervals.includes(requiredInterval)
  );

  if (allNotesInFormula && allRequiredNotesPresent) {
    score += 100;
    totalScoreEl.innerText = `${score} pts`;
    feedbackEl.innerText = "🎉 Bravo ! Formule harmonique parfaitement respectée.";
    feedbackEl.style.color = "var(--md-sys-color-primary)";
    btnValidate.style.display = "none";
    btnNext.style.display = "inline-flex";
  } else {
    feedbackEl.innerText = "❌ Formule incomplète ou note hors accord. Vérifiez votre forme.";
    feedbackEl.style.color = "var(--chord-error)";
  }
});

    btnCorrect.addEventListener('click', () => {
  const q = currentQuestion;
  // Génère la forme de solution basée sur l'accord cible (q.to) et la racine active
  userState = generateValidShape(CHORDS[q.to], q.rootRow, q.rootString);
  
  // Re-rend l'état en activant l'affichage des solutions
  renderState(true);
  centerViewportOnActiveChord();
  
  feedbackEl.innerText = "Voici une forme correcte possible !";
  feedbackEl.style.color = "var(--md-sys-color-on-surface)";
});

    // Indice dynamique
btnHint.addEventListener('click', () => {
  const q = currentQuestion;
  hintBoxEl.innerHTML = `<b>Départ (${q.from}) :</b> ${CHORDS[q.from].hint}<br><b>Cible (${q.to}) :</b> ${CHORDS[q.to].hint}`;
  hintBoxEl.style.display = hintBoxEl.style.display === "block" ? "none" : "block";
});

    btnNext.addEventListener('click', () => {
      const nextIdx = (currentQIdx + 1) % questions.length;
      loadQuestion(nextIdx);
    });

    /* ==========================================================================
       8. THEME & DRAWER CONTROLS
       ========================================================================== */
    const themeBtn = document.getElementById('btn-theme');
    themeBtn.addEventListener('click', () => {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      themeBtn.innerText = next === 'dark' ? '🌙' : '☀️';
    });

    const drawerOverlay = document.getElementById('drawer-overlay');
    document.getElementById('btn-menu').addEventListener('click', () => {
      drawerOverlay.classList.add('open');
    });

    drawerOverlay.addEventListener('click', (e) => {
      if (e.target === drawerOverlay) {
        drawerOverlay.classList.remove('open');
      }
    });

    // Initialize App
    buildMatrix();
    loadQuestion(0);
  </script>
</body>
</html>
