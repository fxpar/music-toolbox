	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.0/dist/abcjs-basic-min.js"></script>

    <script>
        let licksList = [];
        let currentIndex = -1;
        let currentActivity = 1;
        let synthControl = null;

        // Exemple par défaut injecté
        const defaultBatch = `L:1/8
"^1"g"^et"g "^2"g"^et"g "^3"g"^et"g "^4"g"^et"g

"^1"L[Bg]"^et"g "^2"g"^et"L[Bg] "^3"L[Bg]"^et"g "^4"g"^et"g

"^1"[Bg]"^et"g "^2"[Bg]"^et"g "^3"[Bg]"^et"g "^4"[Bg]"^et"g

"^1"[Bg]"^et"g "^2"[Bg]"^et"g "^3"[Bg]"^et"g "^4"[Bg]"^et"g

"^1"[Bg]"^et"g "^2"g"^et"g "^3"[Bg]"^et"g "^4"g"^et"g

"^1"[Bg]"^et"g "^2"g"^et"[Bg] "^3"g"^et"g "^4"[Bg]"^et"g

"^1"[Bg]"^et"g "^2"[Bg]"^et"g "^3"g"^et"[Bg] "^4"g"^et"[Bg]

"^1"[Bg]"^et"g "^2"[Bg]"^et"[Bg] "^3"g"^et"[Bg] "^4"[Bg]"^et"g

"^1"[Bg]"^et"[Bg] "^2"g"^et"[Bg] "^3"g"^et"[Bg] "^4"g"^et"[Bg]

"^1"[Eg]"^et"g "^2"[Bg]"^et"g "^3"[Eg]"^et"g "^4"[Bg]"^et"g

[Eg]g [Bg]g [Eg][Eg] [Bg]g

[Eg][Eg] [Bg]g [Eg][Eg] [Bg]g

[Eg]g [Bg]g gg [Bg]g

[Eg]g [Bg][Bg] [Eg]g [Bg]g

[Eg][Eg] [Bg]g [Eg]g [Bg][Bg]

[Eg]g [Bg]g [Eg]g [Bg]g

"^1"[Eg]g "^2"[Bg]g "^3"[Eg][Eg] "^4"[Ag]g g/4g/4g/4g/4

[Eg]g [Bg][Eg] [Eg]g [Bg]g

[Eg]g [Bg]g [Eg]g [Bg]g

[Eg]g [Bg][Eg] [Eg]g [Bg][Eg]

[Eg]g [Bg][Eg] gg [Bg]g

[Eg]g [Bg][Eg] [Eg]g [Bg]g

[Eg][Eg] [Bg][Eg] [Eg]g [Bg]g

[Eg]g [Bg][Eg] [Eg][Eg] [Bg]g

[Eg]g [Bg][Eg] gg [Bg][Eg]

[Eg]g [Bg]g g[Eg] [Bg]g

[Eg]g [Bg]g g[Eg] [Bg][Eg]

[Eg]g [EBg]g [Eg]g [EBg]g

[Eg]g [EBg]g [Eg][Eg] [EBg]g

[Eg][Eg] [Bg][Eg] [Eg][Eg] [Bg][Eg]`;

        document.getElementById('licksBatch').value = defaultBatch;

        // Directives MIDI par défaut pour percussions
        const midiDirectives = `%%percmap D  pedal-hi-hat x
%%percmap F  bass-drum-1
%%percmap E  acoustic-bass-drum
%%percmap G  low-floor-tom
%%percmap A  high-floor-tom
%%percmap B  low-tom
%%percmap ^B tambourine   triangle
%%percmap c  acoustic-snare
%%percmap _c electric-snare 
%%percmap ^c low-wood-block   triangle
%%percmap =c side-stick x
%%percmap d  low-tom
%%percmap =d low-mid-tom harmonic
%%percmap ^d hi-wood-block    triangle
%%percmap e  hi-mid-tom
%%percmap ^e cowbell      triangle
%%percmap f  high-tom x
%%percmap ^f ride-cymbal-1
%%percmap =f ride-bell harmonic
%%percmap g  closed-hi-hat x
%%percmap ^g open-hi-hat x
%%percmap a  crash-cymbal-1  x
%%percmap ^a open-triangle     triangle
V:1 stem=up`;

        // --- GESTION DU CURSEUR AUDIO ---
        function CursorControl() {
            var self = this;
            self.onStart = function() {
                var svg = document.querySelector("#paper svg");
                if (!svg) return;
                var cursor = document.createElementNS("http://www.w3.org/2000/svg", "line");
                cursor.setAttribute("class", "abcjs-cursor");
                cursor.setAttributeNS(null, 'x1', "0");
                cursor.setAttributeNS(null, 'y1', "0");
                cursor.setAttributeNS(null, 'x2', "0");
                cursor.setAttributeNS(null, 'y2', "0");
                svg.appendChild(cursor);
            };
            self.onEvent = function(ev) {
                if (ev.measureStart && ev.left === null) return;
                document.querySelectorAll("#paper svg .abcjs-highlight").forEach(el => el.classList.remove("abcjs-highlight"));
                if (ev.elements) {
                    for (var i = 0; i < ev.elements.length; i++) {
                        var note = ev.elements[i];
                        for (var j = 0; j < note.length; j++) {
                            note[j].classList.add("abcjs-highlight");
                        }
                    }
                }
                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor && ev.left !== null) {
                    cursor.setAttributeNS(null, 'x1', (ev.left - 2).toString());
                    cursor.setAttributeNS(null, 'x2', (ev.left - 2).toString());
                    cursor.setAttributeNS(null, 'y1', ev.top.toString());
                    cursor.setAttributeNS(null, 'y2', (ev.top + ev.height).toString());
                }
            };
            self.onFinished = function() {
                document.querySelectorAll("#paper svg .abcjs-highlight").forEach(el => el.classList.remove("abcjs-highlight"));
                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor) { 
                    cursor.setAttributeNS(null, 'x1', "0"); 
                    cursor.setAttributeNS(null, 'x2', "0"); 
                }
            };
        }
        const cursorControl = new CursorControl();

        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            document.getElementById('themeToggleBtn').innerHTML = newTheme === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
        }

        // --- DECOUPE ET NETTOYAGE DU BATCH DE LICKS ---
        function loadBatch() {
            const rawText = document.getElementById('licksBatch').value;
            
            // Nettoyage des lignes avec seulement espaces/tabs puis split sur lignes vides
            const lines = rawText.split('\n').map(line => line.trim().length === 0 ? '' : line);
            const cleanedText = lines.join('\n');
            
            licksList = cleanedText.split(/\n\s*\n/).map(block => block.trim()).filter(block => block.length > 0);

            const select = document.getElementById('lickSelect');
            select.innerHTML = '';

            if (licksList.length === 0) {
                select.innerHTML = '<option value="">- Aucun lick -</option>';
                document.getElementById('selectedLickDisplay').innerText = 'Aucun lick trouvé.';
                updateNavButtons();
                return;
            }

            licksList.forEach((_, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `Lick N° ${idx + 1}`;
                select.appendChild(opt);
            });

            selectLick(0);
        }

        function selectLick(index) {
            if (index < 0 || index >= licksList.length) return;
            currentIndex = index;
            document.getElementById('lickSelect').value = index;
            document.getElementById('selectedLickDisplay').innerText = licksList[index];
            updateNavButtons();
            
            // Revenir à l'Activité 1 par défaut au choix d'un nouveau lick
            switchActivity(1);
        }

        function navigateLick(step) {
            selectLick(currentIndex + step);
        }

        function updateNavButtons() {
            document.getElementById('btnPrev').disabled = (currentIndex <= 0);
            document.getElementById('btnNext').disabled = (currentIndex >= licksList.length - 1 || currentIndex === -1);
            document.getElementById('lickSelect').disabled = (licksList.length === 0);
        }

        // --- EXTRACTION DES PARAMETRES ET GENERATION ABC ---
        function parseLickParams(lickText) {
            let xHeader = "X:1";
            let lHeader = lickText.match(/^L:\s*\S+/m)?.[0] || "L:1/8";
            let mHeader = lickText.match(/^M:\s*\S+/m)?.[0] || "M:4/4";
            let qHeader = lickText.match(/^Q:\s*\S+/m)?.[0] || "Q:60";

            // Retirer les en-têtes détectés pour isoler le corps de la musique
            let body = lickText
                .replace(/^X:.*$/gm, '')
                .replace(/^L:.*$/gm, '')
                .replace(/^M:.*$/gm, '')
                .replace(/^Q:.*$/gm, '')
                .trim();

            return { xHeader, lHeader, mHeader, qHeader, body };
        }
		
		
		// Génère une mesure de silence "z" adaptée à la mesure M: (ex: "z z z z" pour 4/4, "z z z" pour 3/4)
		function getRestMeasure(mHeader) {
			const match = mHeader.match(/M:\s*(\d+)\/(\d+)/);
			if (!match) return "z2 z2 z2 z2"; // Valeur par défaut si non trouvée
			
			const beats = parseInt(match[1], 10);
			// Si la mesure a par exemple 12 croches (12/8), on peut ajuster ou générer autant de silences que de temps principaux
			// Pour une mesure standard X/Y :
			let rests = [];
			for (let i = 0; i < beats; i++) {
				rests.push("z2");
			}
			return rests.join(" ");
		}

		// Génère une mesure de "gg" adaptée à la mesure M: pour le tout premier lick
		function getFallbackMeasure(mHeader) {
			const match = mHeader.match(/M:\s*(\d+)\/(\d+)/);
			if (!match) return "gg gg gg gg"; // Valeur par défaut
			
			const beats = parseInt(match[1], 10);
			let notes = [];
			for (let i = 0; i < beats; i++) {
				notes.push("gg"); // 2 croches (g) par temps
			}
			return notes.join(" ");
		}


        function generateABCString() {
            if (currentIndex === -1 || !licksList[currentIndex]) return "";

            const params = parseLickParams(licksList[currentIndex]);
            const fill = document.getElementById('fillPattern').value.trim();

            let finalBody = "";

            switch (currentActivity) {
                case 1:
                    finalBody = params.body;
                    break;
                case 2:
                case 3:
                    // Répétition 4 fois + remplissage
                    finalBody = `${params.body} | ${params.body} | ${params.body} | ${params.body} | ${fill}`;
                    break;
                case 4:
                    // Répétition alternée : Lick | Silence | Lick | Silence | Fill
                    const restMeasure = getRestMeasure(params.mHeader);
                    finalBody = `${params.body} | ${restMeasure} | ${params.body} | ${restMeasure} | ${fill}`;
                    break;
                case 5:
                    // Alternance : Lick actuel | Lick précédent (ou "gg") | Lick actuel | Lick précédent | Fill
                    let altMeasure = "";
                    if (currentIndex > 0) {
                        // On récupère le corps du lick précédent
                        const prevParams = parseLickParams(licksList[currentIndex - 1]);
                        altMeasure = prevParams.body;
                    } else {
                        // S'il n'y a pas de lick précédent (Index 0), on met la mesure par défaut
                        altMeasure = getFallbackMeasure(params.mHeader);
                    }
                    finalBody = `${params.body} | ${altMeasure} | ${params.body} | ${altMeasure} | ${fill}`;
                    break;
                case 6:
                    // TODO: Implémenter Activité 6
                    finalBody = `%% Emplacement Activité 6\n${params.body}`;
                    break;
            }

            return `${params.xHeader}\n${params.mHeader}\n${params.lHeader}\n${params.qHeader}\nK:C clef=perc\n${midiDirectives}\n${finalBody}`;
        }

        function switchActivity(actNumber) {
            currentActivity = actNumber;

            // Mise à jour de la navigation onglets
            const tabs = document.querySelectorAll('#activityTabs .nav-link');
            tabs.forEach((tab, i) => {
                tab.classList.toggle('active', (i + 1) === actNumber);
            });

            // Afficher/masquer la zone de remplissage
            const fillContainer = document.getElementById('fillContainer');
            if (actNumber >= 2 && actNumber <= 5) {
                fillContainer.classList.remove('d-none');
            } else {
                fillContainer.classList.add('d-none');
            }

            // Masquer la partition pour l'activité 3
            const paperContainer = document.getElementById('paperContainer');
            const hiddenMsg = document.getElementById('hiddenPaperMsg');
            if (actNumber === 3) {
                paperContainer.classList.add('d-none');
                hiddenMsg.classList.remove('d-none');
                hiddenMsg.classList.add('d-flex');
            } else {
                paperContainer.classList.remove('d-none');
                hiddenMsg.classList.add('d-none');
                hiddenMsg.classList.remove('d-flex');
            }

            renderCurrentState();
        }

        function renderCurrentState() {
            const abcString = generateABCString();
            document.getElementById('abcSource').value = abcString;
            renderABC(abcString);
        }

        function renderFromEditor() {
            const abcString = document.getElementById('abcSource').value;
            renderABC(abcString);
        }

        // --- RENDU ABCJS (VISUEL + AUDIO) ---
        function renderABC(abcString) {
    if (synthControl) {
        synthControl.pause();
        synthControl = null;
    }

    if (!abcString.trim()) {
        document.getElementById("paper").innerHTML = "";
        document.getElementById("audio-player").innerHTML = "";
        return;
    }

    // 1. On récupère la largeur actuelle du conteneur HTML
    const paperElem = document.getElementById("paper");
    const containerWidth = paperElem.clientWidth - 20; // marge de sécurité
    const isMobile = window.innerWidth < 768;

    // 2. Options de rendu avec staffwidth obligatoire
    const renderOptions = {
        responsive: "resize",
        add_classes: true,
        staffwidth: containerWidth // <--- PARAMÈTRE CLÉ OBLIGATOIRE
    };

    // 3. On ajoute le wrap uniquement sur mobile
    if (isMobile) {
        renderOptions.wrap = {
            preferredMeasuresPerLine: 2,
            minSpacing: 1.5,
            maxSpacing: 3
        };
    }

    // 4. Rendu visuel
    const visualObj = ABCJS.renderAbc("paper", abcString, renderOptions)[0];

            if (ABCJS.synth.supportsAudio()) {
                const audioOptions = {
                    displayLoop: true,
                    displayRestart: true,
                    displayPlay: true,
                    displayProgress: true,
                    displayWarp: true
                };
                
                synthControl = new ABCJS.synth.SynthController();
                synthControl.load("#audio-player", cursorControl, audioOptions);

                const createSynth = new ABCJS.synth.CreateSynth();
                createSynth.init({ visualObj: visualObj }).then(function () {
                    synthControl.setTune(visualObj, false).catch(function (error) {
                        console.warn("Erreur d'initialisation du morceau :", error);
                    });
                }).catch(function (error) {
                    console.warn("Erreur de création de la synthèse audio :", error);
                });
            } else {
                document.getElementById("audio-player").innerHTML = "<div class='alert alert-warning p-2 small'>L'audio n'est pas supporté par ce navigateur.</div>";
            }
        }

        window.onload = function() {
            loadBatch();
        };
    </script>
</body>
</html>
