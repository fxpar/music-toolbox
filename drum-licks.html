        // --- GESTION DU CURSEUR AUDIO ---
        function CursorControl() {
            var self = this;
            self.onStart = function() {
                var svg = document.querySelector("#paper svg");
                if (!svg) return;
                var cursor = document.createElementNS("http://www.w3.org/2000/svg", "line");
                cursor.setAttribute("class", "abcjs-cursor");
                cursor.setAttributeNS(null, 'x1', "0");
                cursor.setAttributeNS(null, 'y1', "0");
                cursor.setAttributeNS(null, 'x2', "0");
                cursor.setAttributeNS(null, 'y2', "0");
                svg.appendChild(cursor);
            };
            self.onEvent = function(ev) {
                if (ev.measureStart && ev.left === null) return;
                document.querySelectorAll("#paper svg .abcjs-highlight").forEach(el => el.classList.remove("abcjs-highlight"));
                if (ev.elements) {
                    for (var i = 0; i < ev.elements.length; i++) {
                        var note = ev.elements[i];
                        for (var j = 0; j < note.length; j++) {
                            note[j].classList.add("abcjs-highlight");
                        }
                    }
                }
                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor && ev.left !== null) {
                    cursor.setAttributeNS(null, 'x1', (ev.left - 2).toString());
                    cursor.setAttributeNS(null, 'x2', (ev.left - 2).toString());
                    cursor.setAttributeNS(null, 'y1', ev.top.toString());
                    cursor.setAttributeNS(null, 'y2', (ev.top + ev.height).toString());
                }
            };
            self.onFinished = function() {
                document.querySelectorAll("#paper svg .abcjs-highlight").forEach(el => el.classList.remove("abcjs-highlight"));
                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor) { 
                    cursor.setAttributeNS(null, 'x1', "0"); 
                    cursor.setAttributeNS(null, 'x2', "0"); 
                }
            };
        }
        const cursorControl = new CursorControl();

        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            document.getElementById('themeToggleBtn').innerHTML = newTheme === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
        }

        // --- DECOUPE ET NETTOYAGE DU BATCH DE LICKS ---
        function loadBatch() {
    const rawText = document.getElementById('licksBatch').value;
    
    // Nettoyage des lignes avec seulement espaces/tabs
    const lines = rawText.split('\n').map(line => line.trim().length === 0 ? '' : line);
    const cleanedText = lines.join('\n');
    
    // Découpage par bloc séparé par une ou plusieurs lignes vides
    const rawBlocks = cleanedText.split(/\n\s*\n/).map(block => block.trim()).filter(block => block.length > 0);

    licksList = [];
    const select = document.getElementById('lickSelect');
    select.innerHTML = '';

    let currentGroup = null; // Élément <optgroup> en cours
    let currentCategoryName = ""; 
    let lickCount = 0;

    rawBlocks.forEach((block) => {
        // 1. Détection si le bloc est uniquement un Titre de Section (ex: "# Licks simples" ou "T: Section 1")
        if (block.startsWith('#') || (block.startsWith('T:') && !block.includes('\n'))) {
            const groupTitle = block.replace(/^#\s*/, '').replace(/^T:\s*/, '').trim();
            
            currentGroup = document.createElement('optgroup');
            currentGroup.label = groupTitle;
            select.appendChild(currentGroup);
            return; // On passe au bloc suivant, ce n'est pas un lick jouable
        }

        // 2. Si c'est un lick : recherche d'un titre interne avec "T:" ou un commentaire "# " au début du bloc
        lickCount++;
        let lickTitle = "";
        
        // Chercher une ligne "T: ..."
        const titleMatch = block.match(/^T:\s*(.+)$/m);
        if (titleMatch) {
            lickTitle = titleMatch[1].trim();
        } else {
            // Chercher une première ligne commençant par "# ..."
            const commentMatch = block.match(/^#\s*(.+)$/m);
            if (commentMatch) {
                lickTitle = commentMatch[1].trim();
            }
        }

        // Si aucun titre n'est trouvé, nom par défaut "Lick N° X"
        const displayName = lickTitle ? `${lickCount}. ${lickTitle}` : `Lick N° ${lickCount}`;

        // Sauvegarde du lick dans le tableau global
        licksList.push(block);
        const lickIndex = licksList.length - 1;

        // Création de l'option <option>
        const opt = document.createElement('option');
        opt.value = lickIndex;
        opt.textContent = displayName;

        // Ajout dans l'optgroup actuel ou directement dans le select
        if (currentGroup) {
            currentGroup.appendChild(opt);
        } else {
            select.appendChild(opt);
        }
    });

    if (licksList.length === 0) {
        select.innerHTML = '<option value="">- Aucun lick -</option>';
        document.getElementById('selectedLickDisplay').innerText = 'Aucun lick trouvé.';
        updateNavButtons();
        return;
    }

    selectLick(0);
}

        function selectLick(index) {
			if (index < 0 || index >= licksList.length) return;
			currentIndex = index;
			document.getElementById('lickSelect').value = index;
			document.getElementById('selectedLickDisplay').innerText = licksList[index];
			updateNavButtons();
			
			// Détecter le tempo d'origine du lick s'il existe, sinon conserver le tempo actuel de l'utilisateur
			var qMatch = licksList[index].match(/^Q:\s*(\d+)/m);
			if (qMatch) {
				document.getElementById('tempoInput').value = qMatch[1];
			}
			switchActivity(1);
		}

        function navigateLick(step) {
            selectLick(currentIndex + step);
        }

        function updateNavButtons() {
            document.getElementById('btnPrev').disabled = (currentIndex <= 0);
            document.getElementById('btnNext').disabled = (currentIndex >= licksList.length - 1 || currentIndex === -1);
            document.getElementById('lickSelect').disabled = (licksList.length === 0);
        }

        // --- EXTRACTION DES PARAMETRES ET GENERATION ABC ---
		// version multi voix
        function parseLickParams(lickText) {
			var lHeader = lickText.match(/^L:\s*\S+/m) ? lickText.match(/^L:\s*\S+/m)[0] : "L:1/8";
			var mHeader = lickText.match(/^M:\s*\S+/m) ? lickText.match(/^M:\s*\S+/m)[0] : "M:4/4";
			var qHeader = lickText.match(/^Q:\s*\S+/m) ? lickText.match(/^Q:\s*\S+/m)[0] : "Q:60";
			var xHeader = "X:1";

			// Retirer les en-têtes
			var rawBody = lickText
				.replace(/^X:.*$/gm, '')
				.replace(/^L:.*$/gm, '')
				.replace(/^M:.*$/gm, '')
				.replace(/^Q:.*$/gm, '')
				.trim();

			var voices = [];
			var lines = rawBody.split("\n");
			var currentVoice = null;

			for (var i = 0; i < lines.length; i++) {
				var line = lines[i].trim();
				if (line.length === 0) continue;

				// Détection d'une ligne de voix (ex: V:1 stem=up)
				var voiceMatch = line.match(/^V:\s*(\d+)(.*)/);
				if (voiceMatch) {
					if (currentVoice) voices.push(currentVoice);
					currentVoice = {
						id: voiceMatch[1],
						params: voiceMatch[2] ? voiceMatch[2].trim() : "",
						lines: []
					};
				} else {
					if (!currentVoice) {
						// Voix unique par défaut
						currentVoice = { id: "1", params: "stem=up", lines: [] };
					}
					currentVoice.lines.push(line);
				}
			}
			if (currentVoice) voices.push(currentVoice);

			// Finaliser le corps de chaque voix
			for (var j = 0; j < voices.length; j++) {
				voices[j].body = voices[j].lines.join("\n");
			}

			return {
				xHeader: xHeader,
				lHeader: lHeader,
				mHeader: mHeader,
				qHeader: qHeader,
				voices: voices
			};
		}
		
		
		// Génère une mesure de silence "z" adaptée à la mesure M: (ex: "z z z z" pour 4/4, "z z z" pour 3/4)
		function getRestMeasure(mHeader) {
			const match = mHeader.match(/M:\s*(\d+)\/(\d+)/);
			if (!match) return "z2 z2 z2 z2"; // Valeur par défaut si non trouvée
			
			const beats = parseInt(match[1], 10);
			// Si la mesure a par exemple 12 croches (12/8), on peut ajuster ou générer autant de silences que de temps principaux
			// Pour une mesure standard X/Y :
			let rests = [];
			for (let i = 0; i < beats; i++) {
				rests.push("z2");
			}
			return rests.join(" ");
		}
		
		// Génère la directive %%MIDI drum en adaptant le nombre de battements au temps fort (76) / faibles (77)
		function getMetronomeDirective(mHeader) {
			const match = mHeader.match(/M:\s*(\d+)\/(\d+)/);
			const beats = match ? parseInt(match[1], 10) : 4;
			
			// Le premier temps est accentué (76 - High Wood Block), les suivants sont faibles (77 - Low Wood Block)
			let pattern = "76";
			let dString = "d";
			
			for (let i = 1; i < beats; i++) {
				pattern += " 77";
				dString += "d";
			}
			
			// Si la mesure dépasse 4 temps (ex: 6/8, 12/8), on duplique pour couvrir tout le motif si besoin
			<!-- return `%%MIDI drum ${dString} ${pattern} ${pattern}\n%%MIDI drumon\n%%MIDI program 1`; -->
			return `%%MIDI drum ${dString} ${pattern} ${pattern}\n%%MIDI drumon`;
		}
		
		
		// Ajuste le tempo via les boutons -5 / +5
		function adjustTempo(delta) {
			const tempoInput = document.getElementById('tempoInput');
			let currentTempo = parseInt(tempoInput.value, 10) || 60;
			currentTempo = Math.max(30, Math.min(280, currentTempo + delta));
			tempoInput.value = currentTempo;
			renderCurrentState();
		}

		// S'assure que la valeur saisie reste valide lors de la frappe manuelle
		function updateTempoFromInput() {
			const tempoInput = document.getElementById('tempoInput');
			let val = parseInt(tempoInput.value, 10);
			if (isNaN(val) || val < 30) val = 30;
			if (val > 280) val = 280;
			tempoInput.value = val;
			renderCurrentState();
		}

		// Génère une mesure de "gg" adaptée à la mesure M: pour le tout premier lick
		function getFallbackMeasure(mHeader) {
			const match = mHeader.match(/M:\s*(\d+)\/(\d+)/);
			if (!match) return "gg gg gg gg"; // Valeur par défaut
			
			const beats = parseInt(match[1], 10);
			let notes = [];
			for (let i = 0; i < beats; i++) {
				notes.push("gg"); // 2 croches (g) par temps
			}
			return notes.join(" ");
		}
		
		// Validation de la valeur Swing (entre 50 et 70)
		function updateSwingFromInput() {
			var swingInput = document.getElementById('swingInput');
			var val = parseInt(swingInput.value, 10);
			if (isNaN(val) || val < 50) val = 50;
			if (val > 70) val = 70;
			swingInput.value = val;
			renderCurrentState();
		}


        function generateABCString() {
    if (currentIndex === -1 || !licksList[currentIndex]) return "";

    var params = parseLickParams(licksList[currentIndex]);
    var fill = document.getElementById('fillPattern').value.trim();
    
    // Récupération Tempo & Swing
    var tempoElem = document.getElementById('tempoInput');
    var currentBpm = (tempoElem && tempoElem.value) ? tempoElem.value : 60;
    var qHeader = "Q:" + currentBpm;
	
	
	// Récupération Tempo
    var metronomeElem = document.getElementById('enableMetronome');
    var useMetronome = (metronomeElem && metronomeElem.checked) ? true : false;
    var metronomeCode = useMetronome ? ("\n" + getMetronomeDirective(params.mHeader)) : "";

    // Analyse du lick précédent pour l'Activité 5
    var prevParams = null;
    if (currentActivity === 5 && currentIndex > 0) {
        prevParams = parseLickParams(licksList[currentIndex - 1]);
    }

    var restMeasure = getRestMeasure(params.mHeader);
    var fallbackMeasure = getFallbackMeasure(params.mHeader);

    var finalBody = "";

    // Traitement Voix par Voix
    for (var v = 0; v < params.voices.length; v++) {
        var voice = params.voices[v];
        var vHeader = "V:" + voice.id + (voice.params ? " " + voice.params : "") + "\n";
        
        var vBody = voice.body;
        var vRest = restMeasure;
        // Si le remplissage est vide, on ne met rien pour aucune voix.
		// Sinon, on met le remplissage sur la V:1 et du silence pour les autres voix.
		var vFill = (fill === "") ? "" : ((v === 0) ? fill : restMeasure);

        // Gestion de l'alternative pour l'Activité 5
        var vAlt = "";
        if (currentActivity === 5) {
            if (prevParams) {
                // Trouver la voix correspondante dans le lick précédent
                var matchedVoice = null;
                for (var pv = 0; pv < prevParams.voices.length; pv++) {
                    if (prevParams.voices[pv].id === voice.id) {
                        matchedVoice = prevParams.voices[pv];
                        break;
                    }
                }
                vAlt = matchedVoice ? matchedVoice.body : restMeasure;
            } else {
                vAlt = (v === 0) ? fallbackMeasure : restMeasure;
            }
        }


		// Variable pour le saut de ligne : '\n' si plusieurs voix, un espace ' ' si voix unique
		var lineBreak = (params.voices.length > 1) ? "\n" : " ";

        // Assemblage des activités par voix
        finalBody += vHeader;

        switch (currentActivity) {
			case 1:
				finalBody += vBody + "| \n";
				break;
			case 2:
			case 3:
				finalBody += vBody + " |" +  vBody + " |" +  vBody + " |" +  vBody + " |" +  vFill + "| \n";
				break;
			case 4:
				finalBody += vBody + " |" + lineBreak + vRest + " |" + lineBreak + vBody + " |" + lineBreak + vRest + " |" + lineBreak + vFill + "| \n";
				break;
			case 5:
				finalBody += vBody + " |" + lineBreak + vAlt + " |" + lineBreak + vBody + " |" + lineBreak + vAlt + " |" + lineBreak + vFill + "| \n";
				break;
		}
    }

    // Directives finales avec le support multivoix %%score
    var fullDirectives = midiDirectives + "\n%%score (1 2 3 4 5 6)";

    return params.xHeader + "\n" + 
           params.mHeader + "\n" + 
           params.lHeader + "\n" + 
           qHeader + "\nK:C clef=perc\n" + 
           fullDirectives + 
           metronomeCode + "\n" + 
           finalBody;
}

        function switchActivity(actNumber) {
            currentActivity = actNumber;

            // Mise à jour de la navigation onglets
            const tabs = document.querySelectorAll('#activityTabs .nav-link');
            tabs.forEach((tab, i) => {
                tab.classList.toggle('active', (i + 1) === actNumber);
            });

            // Afficher/masquer la zone de remplissage
            const fillContainer = document.getElementById('fillContainer');
            if (actNumber >= 2 && actNumber <= 5) {
                fillContainer.classList.remove('d-none');
            } else {
                fillContainer.classList.add('d-none');
            }

            // Masquer la partition pour l'activité 3
            const paperContainer = document.getElementById('paperContainer');
            const hiddenMsg = document.getElementById('hiddenPaperMsg');
            if (actNumber === 3) {
                paperContainer.classList.add('d-none');
                hiddenMsg.classList.remove('d-none');
                hiddenMsg.classList.add('d-flex');
            } else {
                paperContainer.classList.remove('d-none');
                hiddenMsg.classList.add('d-none');
                hiddenMsg.classList.remove('d-flex');
            }

            renderCurrentState();
        }

        function renderCurrentState() {
            const abcString = generateABCString();
            document.getElementById('abcSource').value = abcString;
            renderABC(abcString);
        }

        function renderFromEditor() {
            const abcString = document.getElementById('abcSource').value;
            renderABC(abcString);
        }

        // --- RENDU ABCJS (VISUEL + AUDIO) ---
        function renderABC(abcString) {
			if (synthControl) {
				synthControl.pause();
				synthControl = null;
			}

			var downloadContainer = document.getElementById("midi-download");

			if (!abcString.trim()) {
				document.getElementById("paper").innerHTML = "";
				document.getElementById("audio-player").innerHTML = "";
				if (downloadContainer) downloadContainer.innerHTML = "";
				return;
			}

			var paperElem = document.getElementById("paper");
			var containerWidth = paperElem.clientWidth - 20;
			var isMobile = window.innerWidth < 768;

			var renderOptions = {
				responsive: "resize",
				add_classes: true,
				staffwidth: containerWidth
			};

			if (isMobile) {
				renderOptions.wrap = {
					preferredMeasuresPerLine: 2,
					minSpacing: 1.5,
					maxSpacing: 3
				};
			}

			// 1. Rendu visuel
			var visualObj = ABCJS.renderAbc("paper", abcString, renderOptions)[0];

			// 2. Génération du lien de téléchargement MIDI (Moderne ABCJS)
			if (downloadContainer && visualObj) {
				// Option 1 : ABCJS génère directement la balise HTML <a>
				var midiHtml = ABCJS.synth.getMidiFile(visualObj, {
					midiOutputType: "link",
					downloadLabel: "Télécharger le fichier MIDI (%T)"
				});
				downloadContainer.innerHTML = midiHtml;

				// Mise en forme Bootstrap du lien généré
				var linkElem = downloadContainer.querySelector("a");
				if (linkElem) {
					linkElem.className = "btn btn-sm btn-outline-secondary";
					linkElem.innerHTML = '<i class="bi bi-download me-1"></i> ' + linkElem.innerHTML;
				}
			}

			// 3. Rendu Audio synthétisé
			if (ABCJS.synth.supportsAudio()) {
				var audioOptions = {
					displayLoop: true,
					displayRestart: true,
					displayPlay: true,
					displayProgress: true,
					displayWarp: false
				};
				
				synthControl = new ABCJS.synth.SynthController();
				synthControl.load("#audio-player", cursorControl, audioOptions);


			// Récupération de la valeur Swing
				var swingElem = document.getElementById('swingInput');
				var swingVal = (swingElem && swingElem.value) ? parseFloat(swingElem.value) : 0;

				// Normalisation : si la valeur du champ est 50 (binaire), on met 0 pour désactiver le swing
				if (swingVal <= 50) {
					swingVal = 0;
				}

				// Paramètres audio/synthé injectés directement
				var synthParams = {
					swing: swingVal
				};


				var createSynth = new ABCJS.synth.CreateSynth();
				createSynth.init({ visualObj: visualObj, options: synthParams }).then(function () {
					synthControl.setTune(visualObj, false, synthParams).catch(function (error) {
						console.warn("Erreur d'initialisation du morceau :", error);
					});
				}).catch(function (error) {
					console.warn("Erreur de création de la synthèse audio :", error);
				});
			} else {
				document.getElementById("audio-player").innerHTML = "<div class='alert alert-warning p-2 small'>L'audio n'est pas supporté par ce navigateur.</div>";
			}
		}

        window.onload = function() {
            loadBatch();
        };
    </script>
