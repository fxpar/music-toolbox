<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ukulele Pedagogical Tool - V2.1</title>
  <style>
    /* ==========================================================================
       1. MATERIAL DESIGN 3 DESIGN TOKENS (LIGHT / DARK)
       ========================================================================== */
    :root[data-theme="dark"] {
      --md-sys-color-background: #141218;
      --md-sys-color-on-background: #e6e0e9;
      --md-sys-color-surface: #141218;
      --md-sys-color-surface-container: #211f26;
      --md-sys-color-surface-container-high: #2b2930;
      --md-sys-color-on-surface: #e6e0e9;
      --md-sys-color-on-surface-variant: #cac4d0;
      --md-sys-color-primary: #d0bcff;
      --md-sys-color-on-primary: #381e72;
      --md-sys-color-primary-container: #4f378b;
      --md-sys-color-on-primary-container: #eaddff;
      --md-sys-color-secondary: #ccc2dc;
      --md-sys-color-on-secondary: #332d41;
      --md-sys-color-outline: #938f99;
      --md-sys-color-outline-variant: #49454f;
      
      --chord-root: #ffb4ab;
      --chord-root-text: #690005;
      --chord-interval: #a8c7ff;
      --chord-interval-text: #003062;
      --fretboard-wood: #231f20;
      --fret-wire: #49454f;
      --string-color: #e6e0e9;
    }

    :root[data-theme="light"] {
      --md-sys-color-background: #fef7ff;
      --md-sys-color-on-background: #1d1b20;
      --md-sys-color-surface: #fef7ff;
      --md-sys-color-surface-container: #f3edf7;
      --md-sys-color-surface-container-high: #ece6f0;
      --md-sys-color-on-surface: #1d1b20;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-primary: #6750a4;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #eaddff;
      --md-sys-color-on-primary-container: #21005d;
      --md-sys-color-secondary: #625b71;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-outline: #79747e;
      --md-sys-color-outline-variant: #c9c5d0;

      --chord-root: #ba1a1a;
      --chord-root-text: #ffffff;
      --chord-interval: #0061a4;
      --chord-interval-text: #ffffff;
      --fretboard-wood: #4a3e3d;
      --fret-wire: #938f99;
      --string-color: #1d1b20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top App Bar */
    .top-bar {
      height: 64px;
      background-color: var(--md-sys-color-surface-container);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 10;
      flex-shrink: 0;
    }

    .top-bar h1 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--md-sys-color-primary);
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--md-sys-color-on-surface);
      font-size: 1rem;
      padding: 6px 10px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    /* Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
    }
    .drawer-overlay.open { display: flex; }
    .drawer {
      position: fixed;
      top: 0; bottom: 0; left: 0;
      width: 280px;
      background-color: var(--md-sys-color-surface-container-high);
      z-index: 101;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    /* Fretboard Viewport */
    .fretboard-viewport {
      flex: 1;
      overflow-y: auto;
      position: relative;
      background-color: var(--md-sys-color-surface-container-high);
      display: flex;
      justify-content: center;
      padding-bottom: 240px;
    }

    .fretboard {
      width: 100%;
      max-width: 380px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .string-header {
      position: sticky;
      top: 0;
      background-color: var(--md-sys-color-surface-container-high);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      font-weight: bold;
      color: var(--md-sys-color-primary);
      z-index: 5;
      border-bottom: 2px solid var(--md-sys-color-outline-variant);
      font-size: 0.85rem;
    }

    .strings-container {
      position: absolute;
      top: 36px; bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
      z-index: 2;
    }

    .string-line {
      width: 2px;
      background-color: var(--string-color);
      height: 400vh;
    }

    .fret-row {
      height: 65px;
      min-height: 65px;
      flex-shrink: 0;
      border-bottom: 2px solid var(--fret-wire);
      position: relative;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 3;
    }

    .note-spot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 4;
      font-weight: 700;
      font-size: 0.8rem;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--md-sys-color-on-surface);
    }

    .note-spot.active {
      background-color: var(--chord-interval);
      color: var(--chord-interval-text);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .note-spot.root {
      background-color: var(--chord-root) !important;
      color: var(--chord-root-text) !important;
    }

    /* Barré corrigé : bloc de fond propre derrière les notes */
    .barre-indicator {
      position: absolute;
      top: 4px; bottom: 4px;
      background-color: rgba(103, 80, 164, 0.25);
      border: 1px dashed var(--md-sys-color-primary);
      border-radius: 8px;
      pointer-events: none;
      z-index: 1;
    }

    /* Bottom Sheet Controls */
    .bottom-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background-color: var(--md-sys-color-surface-container-high);
      border-radius: 24px 24px 0 0;
      padding: 12px 16px 20px 16px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sheet-handle {
      width: 32px; height: 4px;
      background-color: var(--md-sys-color-outline);
      border-radius: 2px;
      align-self: center;
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row-tools {
      display: flex;
      gap: 6px;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 16px;
      border: none;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-primary);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .btn-primary {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    /* D-Pad (Étoile) pour la racine */
    .dpad-container {
      display: grid;
      grid-template-columns: 36px 36px 36px;
      grid-template-rows: 36px 36px 36px;
      gap: 2px;
      justify-content: center;
      align-items: center;
    }
    .dpad-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-weight: bold;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
    }
    .dpad-btn.center { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }

    /* Presets horizontaux */
    .presets-row {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .preset-chip {
      flex-shrink: 0;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline);
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
    }
    .preset-chip.active {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }
    
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="top-bar">
    <button class="icon-btn" id="btn-menu" aria-label="Menu">☰</button>
    <h1>Ukulele V2.1</h1>
    <div style="display: flex; gap: 4px;">
      <button class="icon-btn" id="btn-notation" title="Basculer Notation FR/INT">FR</button>
      <button class="icon-btn" id="btn-import" title="Importer JSON">📁</button>
      <input type="file" id="file-input" accept=".json">
      <button class="icon-btn" id="btn-audio" title="Jouer l'accord arpégé">🔊</button>
      <button class="icon-btn" id="btn-theme" title="Mode Jour/Nuit">🌙</button>
    </div>
  </header>

  <!-- Navigation Drawer -->
  <div class="drawer-overlay" id="drawer-overlay">
    <nav class="drawer">
      <h2>Paramètres</h2>
      <button class="btn" id="btn-close-drawer">Fermer</button>
      <hr style="opacity:0.2">
      <label><b>Accordage (4 à 1) :</b></label>
      <input type="text" id="drawer-tuning" value="7, 0, 4, 9" style="padding:6px;">
      <label><b>Noms des cordes :</b></label>
      <input type="text" id="drawer-strings" value="Sol, Do, Mi, La" style="padding:6px;">
      <label><b>Note de Référence Audio (ex: Do4 = 261.63Hz) :</b></label>
      <input type="number" id="drawer-audioref" value="261.63" step="0.1" style="padding:6px;">
      <button class="btn btn-primary" id="btn-save-drawer">Appliquer</button>
    </nav>
  </div>

  <!-- Fretboard Viewport -->
  <main class="fretboard-viewport" id="viewport">
    <div class="fretboard" id="fretboard">
      <div class="string-header">
        <span id="sname-0">Sol</span>
        <span id="sname-1">Do</span>
        <span id="sname-2">Mi</span>
        <span id="sname-3">La</span>
      </div>
      <div class="strings-container">
        <div class="string-line"></div>
        <div class="string-line"></div>
        <div class="string-line"></div>
        <div class="string-line"></div>
      </div>
    </div>
  </main>

  <!-- Bottom Sheet Controls -->
  <footer class="bottom-sheet">
    <div class="sheet-handle"></div>
    
    <div class="control-panel">
      <!-- Ligne 1 : Mode d'action, Export JSON & Déplacement couleur position -->
      <div class="row-tools">
        <button class="btn btn-primary" id="btn-mode">Mode: Nom [Cycle]</button>
        <div style="display:flex; gap:4px;">
          <button class="btn" id="btn-pos-up" title="Monter la position et la racine">▲ Pos</button>
          <button class="btn" id="btn-pos-down" title="Descendre la position et la racine">▼ Pos</button>
        </div>
        <button class="btn" id="btn-export">Export</button>
      </div>

      <!-- Ligne 2 : Presets horizontaux d'étapes de progression -->
      <div class="presets-row" id="presets-container">
        <!-- Généré dynamiquement -->
      </div>

      <!-- Ligne 3 : Croix de déplacement de la racine (D-Pad) + Bouton central Preset -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 0.75rem; opacity: 0.8;">Déplacement Racine :</div>
        <div class="dpad-container">
          <div></div>
          <button class="dpad-btn" id="dpad-up">▲</button>
          <div></div>
          <button class="dpad-btn" id="dpad-left">◀</button>
          <button class="dpad-btn center" id="dpad-center" title="Sauvegarder Preset">💾</button>
          <button class="dpad-btn" id="dpad-right">▶</button>
          <div></div>
          <button class="dpad-btn" id="dpad-down">▼</button>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // --- CONFIGURATION & ÉTATS ---
    let STRING_OFFSETS = [7, 0, 4, 9]; // G, C, E, A
    let STRING_NAMES = ["Sol", "Do", "Mi", "La"];
    let AUDIO_REF_FREQ = 261.63; // Fréquence de base (Do)
    let isInternationalNotation = false; // false = FR (Do, Ré, Mi), true = INT (C, D, E)
    
    const TOTAL_ROWS = 36;
    const ANCHOR_ROW = 12;

    let rootPosition = { string: 1, row: ANCHOR_ROW }; // Racine initiale sur Do au milieu
    let interactionMode = 0; // 0: Nom (cycle alias), 1: Couleur (position), 2: Barré
    
    let gridState = Array.from({ length: 4 }, () => Array(TOTAL_ROWS).fill(0));
    let customNameAliases = {}; // Stocke l'index de l'alias sélectionné par note: { "s-r": aliasIdx }
    let barreStates = {}; // { rowIdx: { startString, endString } }
    let colorPositions = {}; // Stocke les positions colorées

    let presets = [];
    let currentPresetIdx = 0;

    const INTERVAL_NAMES_FR = {
      0: ['R', '8'], 1: ['b2'], 2: ['2', '9'], 3: ['b3'], 4: ['3'],
      5: ['4', '11'], 6: ['b5', '#4'], 7: ['5'], 8: ['#5'], 9: ['6', 'bb7', '13'], 10: ['b7'], 11: ['7']
    };

    const INTERVAL_NAMES_INT = {
      0: ['R', '8'], 1: ['b2'], 2: ['2', '9'], 3: ['♫ b3'], 4: ['3'],
      5: ['4', '11'], 6: ['b5', '#4'], 7: ['5'], 8: ['#5'], 9: ['6', 'bb7', '13'], 10: ['b7'], 11: ['7']
    };

    const fretboardEl = document.getElementById('fretboard');
    const viewportEl = document.getElementById('viewport');

    // --- INITIALISATION DU MANCHE ---
    function buildMatrix() {
      const stringsContainer = fretboardEl.querySelector('.strings-container');
      const stringHeader = fretboardEl.querySelector('.string-header');
      fretboardEl.innerHTML = '';
      if (stringHeader) fretboardEl.appendChild(stringHeader);
      if (stringsContainer) fretboardEl.appendChild(stringsContainer);

      for (let r = 0; r < TOTAL_ROWS; r++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'fret-row';
        rowEl.dataset.row = r;

        const barreEl = document.createElement('div');
        barreEl.className = 'barre-indicator';
        rowEl.appendChild(barreEl);

        for (let s = 0; s < 4; s++) {
          const spot = document.createElement('div');
          spot.className = 'note-spot';
          spot.dataset.string = s;
          spot.dataset.row = r;

          spot.addEventListener('click', () => handleSpotClick(s, r));
          rowEl.appendChild(spot);
        }
        fretboardEl.appendChild(rowEl);
      }
      initDefaultState();
    }

    function initDefaultState() {
      gridState = Array.from({ length: 4 }, () => Array(TOTAL_ROWS).fill(0));
      gridState[rootPosition.string][rootPosition.row] = 1;
      renderState();
      centerOnRow(rootPosition.row);
      savePresetState("Init");
    }

    // --- LOGIQUE DES CLICS ET MODES ---
    function handleSpotClick(stringIdx, rowIndex) {
      const key = `${stringIdx}-${rowIndex}`;
      if (interactionMode === 0) {
        // Mode Nom : Cycle des alias multiples pour cette note
        const rootPitch = (STRING_OFFSETS[rootPosition.string] + rootPosition.row) % 12;
        const spotPitch = (STRING_OFFSETS[stringIdx] + rowIndex) % 12;
        const interval = (spotPitch - rootPitch + 12) % 12;
        const names = isInternationalNotation ? INTERVAL_NAMES_INT[interval] : INTERVAL_NAMES_FR[interval];
        
        if (names.length > 1) {
          let currentIdx = customNameAliases[key] || 0;
          customNameAliases[key] = (currentIdx + 1) % names.length;
        }
      } else if (interactionMode === 1) {
        // Mode Couleur : Marquer / Démarquer la position
        colorPositions[key] = !colorPositions[key];
      } else if (interactionMode === 2) {
        // Mode Barré neutre : crée ou supprime un barré sur cette frette sans modifier les noms/couleurs
        if (!barreStates[rowIndex]) {
          // Déterminer automatiquement les bornes gauche/droite du barré cliqué
          barreStates[rowIndex] = { startString: stringIdx, endString: stringIdx };
        } else {
          delete barreStates[rowIndex];
        }
      }
      renderState();
    }

    // --- RENDU GRAPHIQUE ---
    function renderState() {
      const spots = fretboardEl.querySelectorAll('.note-spot');
      spots.forEach(spot => {
        const s = parseInt(spot.dataset.string);
        const r = parseInt(spot.dataset.row);
        const key = `${s}-${r}`;
        
        spot.className = 'note-spot';
        spot.innerText = '';
        spot.style.backgroundColor = '';
        spot.style.color = '';

        const rootPitch = (STRING_OFFSETS[rootPosition.string] + rootPosition.row) % 12;
        const spotPitch = (STRING_OFFSETS[s] + r) % 12;
        const interval = (spotPitch - rootPitch + 12) % 12;
        
        const names = isInternationalNotation ? INTERVAL_NAMES_INT[interval] : INTERVAL_NAMES_FR[interval];
        const aliasIdx = customNameAliases[key] || 0;
        spot.innerText = names[aliasIdx % names.length];

        if (s === rootPosition.string && r === rootPosition.row) {
          spot.classList.add('root');
          spot.innerText = isInternationalNotation ? 'R' : 'R';
        } else if (gridState[s][r] > 0 || colorPositions[key]) {
          spot.classList.add('active');
        }
      });

      // Rendu des barrés neutres (sans altérer notes/couleurs)
      for (let r = 0; r < TOTAL_ROWS; r++) {
        const rowEl = fretboardEl.querySelector(`.fret-row[data-row="${r}"]`);
        const barreEl = rowEl.querySelector('.barre-indicator');
        const bData = barreStates[r];
        if (bData) {
          barreEl.style.display = 'block';
          // Calculer la position visuelle du conteneur de barré
          barreEl.style.left = `calc(${bData.startString * 25}% + 8px)`;
          barreEl.style.width = `calc(${((bData.endString - bData.startString + 1) * 25)}% - 16px)`;
        } else {
          barreEl.style.display = 'none';
        }
      }

      // Mise à jour des noms des cordes
      for(let i=0; i<4; i++) {
        document.getElementById(`sname-${i}`).innerText = `${STRING_NAMES[i]} (${4-i})`;
      }
    }

    // --- D-PAD & DÉPLACEMENT DE LA RACINE ---
    function moveRoot(dRow, dString) {
      rootPosition.row = Math.max(0, Math.min(TOTAL_ROWS - 1, rootPosition.row + dRow));
      rootPosition.string = Math.max(0, Math.min(3, rootPosition.string + dString));
      renderState();
      centerOnRow(rootPosition.row);
    }

    document.getElementById('dpad-up').addEventListener('click', () => moveRoot(-1, 0));
    document.getElementById('dpad-down').addEventListener('click', () => moveRoot(1, 0));
    document.getElementById('dpad-left').addEventListener('click', () => moveRoot(0, -1));
    document.getElementById('dpad-right').addEventListener('click', () => moveRoot(0, 1));
    document.getElementById('dpad-center').addEventListener('click', () => savePresetState(`Preset ${presets.length + 1}`));

    // --- DÉPLACEMENT GLOBAL (POSITION + ANCIENNE RACINE TRANSFORMÉE EN BLEU) ---
    function shiftGlobalPosition(offset) {
      // 1. L'ancienne position de racine devient une note colorée active (bleue)
      colorPositions[`${rootPosition.string}-${rootPosition.row}`] = true;

      // 2. Déplacer la racine mathématiquement
      let newRow = Math.max(0, Math.min(TOTAL_ROWS - 1, rootPosition.row + offset));
      rootPosition.row = newRow;

      // 3. Déplacer également l'ensemble des notes colorées existantes
      let newColors = {};
      Object.keys(colorPositions).forEach(key => {
        if(colorPositions[key]) {
          let [s, r] = key.split('-').map(Number);
          let shiftedR = Math.max(0, Math.min(TOTAL_ROWS - 1, r + offset));
          newColors[`${s}-${shiftedR}`] = true;
        }
      });
      colorPositions = newColors;

      // S'assurer que la nouvelle position de racine ne reste pas marquée en double dans les couleurs
      delete colorPositions[`${rootPosition.string}-${rootPosition.row}`];

      renderState();
      centerOnRow(rootPosition.row);
    }

    document.getElementById('btn-pos-up').addEventListener('click', () => shiftGlobalPosition(-1));
    document.getElementById('btn-pos-down').addEventListener('click', () => shiftGlobalPosition(1));

    // --- GESTION DES PRESETS & JSON ---
    function savePresetState(name) {
      const preset = {
        name: name,
        root: { ...rootPosition },
        grid: JSON.parse(JSON.stringify(gridState)),
        barres: JSON.parse(JSON.stringify(barreStates)),
        colors: JSON.parse(JSON.stringify(colorPositions)),
        aliases: JSON.parse(JSON.stringify(customNameAliases))
      };
      presets.push(preset);
      renderPresetsUI();
    }

    function renderPresetsUI() {
      const container = document.getElementById('presets-container');
      container.innerHTML = '';
      presets.forEach((p, idx) => {
        const chip = document.createElement('button');
        chip.className = `preset-chip ${idx === currentPresetIdx ? 'active' : ''}`;
        chip.innerText = p.name;
        chip.addEventListener('click', () => {
          currentPresetIdx = idx;
          rootPosition = { ...p.root };
          gridState = JSON.parse(JSON.stringify(p.grid));
          barreStates = JSON.parse(JSON.stringify(p.barres));
          colorPositions = JSON.parse(JSON.stringify(p.colors));
          customNameAliases = JSON.parse(JSON.stringify(p.aliases || {}));
          renderState();
          renderPresetsUI();
        });
        container.appendChild(chip);
      });
    }

    // Export JSON
    document.getElementById('btn-export').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(presets, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "ukulele_progression.json");
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    });

    // Import JSON
    const fileInput = document.getElementById('file-input');
    document.getElementById('btn-import').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported) && imported.length > 0) {
            presets = imported;
            currentPresetIdx = 0;
            // Charger le premier preset du fichier
            const p = presets[0];
            rootPosition = { ...p.root };
            gridState = JSON.parse(JSON.stringify(p.grid));
            barreStates = JSON.parse(JSON.stringify(p.barres));
            colorPositions = JSON.parse(JSON.stringify(p.colors));
            customNameAliases = JSON.parse(JSON.stringify(p.aliases || {}));
            renderState();
            renderPresetsUI();
            alert("Progression JSON importée avec succès !");
          }
        } catch (err) {
          alert("Erreur lors de la lecture du fichier JSON.");
        }
      };
      reader.readAsText(file);
      fileInput.value = '';
    });

    // --- AUDIO API : ARPÈGE DE LA PLUS GRAVE À LA PLUS AIGUË ---
    document.getElementById('btn-audio').addEventListener('click', () => {
      if (!window.AudioContext && !window.webkitAudioContext) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Fréquences de base MIDI pour les 4 cordes (ordre physique ukulélé: G, C, E, A -> 0, 1, 2, 3)
      // On calcule les fréquences relatives par rapport à la note de référence (Considérant la Racine comme Do de base)
      const baseFrequencies = [
        AUDIO_REF_FREQ * Math.pow(2, (STRING_OFFSETS[0] - STRING_OFFSETS[1]) / 12), // Corde 0 (Sol)
        AUDIO_REF_FREQ,                                                              // Corde 1 (Do)
        AUDIO_REF_FREQ * Math.pow(2, (STRING_OFFSETS[2] - STRING_OFFSETS[1]) / 12), // Corde 2 (Mi)
        AUDIO_REF_FREQ * Math.pow(2, (STRING_OFFSETS[3] - STRING_OFFSETS[1]) / 12)  // Corde 3 (La)
      ];

      // Trouver pour chaque corde (de 0 à 3) la note active la plus basse jouée sur le manche
      let noteEvents = [];
      for (let s = 0; s < 4; s++) {
        let lowestRow = -1;
        for (let r = 0; r < TOTAL_ROWS; r++) {
          const key = `${s}-${r}`;
          const isRoot = (s === rootPosition.string && r === rootPosition.row);
          if (isRoot || gridState[s][r] > 0 || colorPositions[key]) {
            lowestRow = r;
            break; // On prend la plus basse (première trouvée en partant du haut)
          }
        }
        if (lowestRow !== -1) {
          // Calcul de la fréquence précise de cette note
          const semitoneOffsetFromRoot = lowestRow - rootPosition.row;
          const freq = baseFrequencies[s] * Math.pow(2, semitoneOffsetFromRoot / 12);
          noteEvents.push({ string: s, freq: freq });
        }
      }

      // Jouer les notes l'une après l'autre (arpège de la corde 0 à la corde 3 si actives)
      noteEvents.forEach((ev, index) => {
        playTone(ctx, ev.freq, ctx.currentTime + (index * 0.25));
      });
    });

    function playTone(ctx, freq, time) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, time);
      gain.gain.setValueAtTime(0.25, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.6);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(time);
      osc.stop(time + 0.6);
    }

    // --- CHANGEMENT DE MODE D'ACTION ---
    const modeBtn = document.getElementById('btn-mode');
    const modeNames = ["Mode: Nom [Cycle]", "Mode: Couleur", "Mode: Barré"];
    modeBtn.addEventListener('click', () => {
      interactionMode = (interactionMode + 1) % 3;
      modeBtn.innerText = modeNames[interactionMode];
    });

    // Bouton de bascule de notation FR / INT
    const notationBtn = document.getElementById('btn-notation');
    notationBtn.addEventListener('click', () => {
      isInternationalNotation = !isInternationalNotation;
      notationBtn.innerText = isInternationalNotation ? 'INT' : 'FR';
      renderState();
    });

    function centerOnRow(rowIdx) {
      const rowEl = fretboardEl.querySelector(`.fret-row[data-row="${rowIdx}"]`);
      if (rowEl) {
        viewportEl.scrollTo({ top: rowEl.offsetTop - (viewportEl.clientHeight / 2), behavior: 'smooth' });
      }
    }

    // --- UI DRAWER & THEME ---
    document.getElementById('btn-theme').addEventListener('click', () => {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    });

    document.getElementById('btn-menu').addEventListener('click', () => document.getElementById('drawer-overlay').classList.add('open'));
    document.getElementById('btn-close-drawer').addEventListener('click', () => document.getElementById('drawer-overlay').classList.remove('open'));

    document.getElementById('btn-save-drawer').addEventListener('click', () => {
      STRING_OFFSETS = document.getElementById('drawer-tuning').value.split(',').map(n => parseInt(n.trim()));
      STRING_NAMES = document.getElementById('drawer-strings').value.split(',').map(s => s.trim());
      AUDIO_REF_FREQ = parseFloat(document.getElementById('drawer-audioref').value) || 261.63;
      renderState();
      document.getElementById('drawer-overlay').classList.remove('open');
    });

    // Démarrage initial
    buildMatrix();
  </script>
</body>
</html>
