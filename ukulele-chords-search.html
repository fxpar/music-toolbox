<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ukulele accords encyclopédie</title>
    <!-- Bootstrap 5.3 CDN ou Local -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Script Uke-Chord -->
    <script src="https://pianosnake.github.io/uke-chord/uke-chord.js"></script>
    <style>
        .chord-card {
            text-align: center;
            padding: 15px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px;
            background: rgba(0,0,0,0.02);
            transition: all 0.2s;
            height: 100%;
        }
        [data-bs-theme="dark"] .chord-card {
            border-color: rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
        }
        /* Mode nuit par défaut : on inverse les couleurs du diagramme */
        [data-bs-theme="dark"] uke-chord {
            filter: invert(0.9) hue-rotate(180deg);
        }
        uke-chord {
            display: block;
            margin: 0 auto;
            max-width: 120px;
        }
        /* Style pour les listes de sélection à choix multiples */
        .search-select {
            height: 120px;
        }
    </style>
  <!-- Zone sûre (encoche / barre d'état), nécessite viewport-fit=cover. Ignoré par les vieux navigateurs. -->
  <style id="fx-safe-area">
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .offcanvas-start, .offcanvas-end {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body>

    <!-- Barre de navigation / Header -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold"><i class="bi bi-music-note-beamed me-2"></i><span data-i18n="brand">Uke encyclopédie</span></span>
            <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary" data-i18n-toggle>FR</button>
            <button class="btn btn-outline-secondary" id="themeToggle" data-i18n-title="theme.toggle" title="Mode jour / nuit">
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            </button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <!-- Formulaire de Recherche & Filtrage -->
        <div class="card p-4 mb-4 shadow-sm">
            <h5 class="card-title mb-3"><i class="bi bi-search me-2"></i><span data-i18n="search.title">Moteur de recherche d'accords</span></h5>
            <div class="row g-3">
                
                <!-- Sélection des Fondamentales (Keys) -->
                <div class="col-md-3">
                    <label class="form-label fw-semibold" data-i18n="lbl.keys">Fondamentale(s) (Ctrl+Clic)</label>
                    <select id="selectKeys" class="form-select search-select" multiple>
                        <!-- Rempli dynamiquement -->
                    </select>
                    <div class="form-text" data-i18n="hint.empty">Laissez vide pour tout afficher</div>
                </div>

                <!-- Sélection des Suffixes (Types d'accord) -->
                <div class="col-md-3">
                    <label class="form-label fw-semibold" data-i18n="lbl.types">Type(s) d'accord (Ctrl+Clic)</label>
                    <select id="selectSuffixes" class="form-select search-select" multiple>
                        <!-- Rempli dynamiquement -->
                    </select>
                    <div class="form-text" data-i18n="hint.empty">Laissez vide pour tout afficher</div>
                </div>

                <!-- Sélection des Variantes (Positions) -->
                <div class="col-md-3">
                    <label class="form-label fw-semibold" data-i18n="lbl.pos">Position / Variante (Ctrl+Clic)</label>
                    <select id="selectPositions" class="form-select search-select" multiple>
                        <option value="0" selected data-i18n="pos.1">1ère Position</option>
                        <option value="1" data-i18n="pos.2">2ème Position</option>
                        <option value="2" data-i18n="pos.3">3ème Position</option>
                        <option value="3" data-i18n="pos.4">4ème Position</option>
                    </select>
                    <div class="form-text" data-i18n="hint.pos">Sélectionnez les variantes voulues</div>
                </div>

                <!-- Options de tri et bouton de réinitialisation -->
                <div class="col-md-3 d-flex flex-column justify-content-between">
                    <div>
                        <label class="form-label fw-semibold" data-i18n="lbl.sort">Trier les résultats par :</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="sortOrder" id="sortByGamma" value="gamma" checked>
                            <label class="form-check-label" for="sortByGamma" data-i18n="sort.key">
                                Gamme / Fondamentale (A, B, C...)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="sortOrder" id="sortByType" value="type">
                            <label class="form-check-label" for="sortByType" data-i18n="sort.type">
                                Type d'accord (major, minor...)
                            </label>
                        </div>
                    </div>
                    <button class="btn btn-outline-danger w-100 mt-3" id="btnReset"><i class="bi bi-arrow-counterclockwise me-1"></i><span data-i18n="btn.reset">Réinitialiser</span></button>
                </div>

            </div>
        </div>

        <!-- Section des Grilles d'accords -->
        <h4 class="mb-3" id="resultsCount">0 accord trouvé</h4>
        <div id="schemaContainer" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3">
            <!-- Rempli dynamiquement en JS -->
        </div>
    </div>
	
		<footer class="mt-auto py-3 bg-body-tertiary border-top text-body-secondary transition-colors">
	  <div class="container">
		<div class="row align-items-center gy-2">
		  <!-- Colonne 1 : Copyright & Titre -->
		  <div class="col-12 col-md-6 text-center text-md-start">
			<span class="small">
			  CC BY-NC 4.0 <span id="currentYear"></span><script>document.getElementById("currentYear").textContent = new Date().getFullYear();</script> <strong>François Parlant</strong> &mdash; <span data-i18n="footer.made">Créé avec passion pour l'ukulélé.</span>
			</span>
		  </div>

		  <!-- Colonne 2 : Liens Réseaux Sociaux -->
		  <div class="col-12 col-md-6 text-center text-md-end">
			<div class="d-inline-flex gap-3 align-items-center">
			  <a href="https://github.com/fxpar/music-toolbox/blob/main/ukulele-chords-search.html" target="_blank" rel="noopener noreferrer" class="text-body-secondary text-decoration-none fs-5 hover-accent" title="Code source GitHub" data-i18n-title="footer.github"> 
				<i class="bi bi-github"></i> 
			  </a> 
			  <a href="https://www.linkedin.com/in/francois-parlant" target="_blank" rel="noopener noreferrer" class="text-body-secondary text-decoration-none fs-5 hover-accent" title="LinkedIn: François Parlant" data-i18n-title="footer.linkedin">
				<i class="bi bi-linkedin"></i> 
			  </a> 
			  <a href="https://www.youtube.com/c/enparlantdebureautiqueformezvous" target="_blank" rel="noopener noreferrer" class="text-body-secondary text-decoration-none fs-5 hover-accent" title="Tutos YouTube: En parlant de bureautique" data-i18n-title="footer.youtube">
				<i class="bi bi-youtube"></i> 
			  </a>
			</div>
		  </div>
		</div>
	  </div>
	</footer>

    <script src="./js/i18n-fx.js"></script>
    <!-- Chargement de la bibliothèque de données -->
    <script src="./ukulele.js"></script>

    <!-- Script Logique Applicative -->
    <script>
        FxI18n.add({
            fr: {
                'page.title': 'Ukulele accords encyclopédie',
                'brand': 'Uke encyclopédie',
                'theme.toggle': 'Mode jour / nuit',
                'search.title': "Moteur de recherche d'accords",
                'lbl.keys': 'Fondamentale(s) (Ctrl+Clic)',
                'lbl.types': "Type(s) d'accord (Ctrl+Clic)",
                'lbl.pos': 'Position / Variante (Ctrl+Clic)',
                'hint.empty': 'Laissez vide pour tout afficher',
                'hint.pos': 'Sélectionnez les variantes voulues',
                'pos.1': '1ère Position', 'pos.2': '2ème Position', 'pos.3': '3ème Position', 'pos.4': '4ème Position',
                'lbl.sort': 'Trier les résultats par :',
                'sort.key': 'Gamme / Fondamentale (A, B, C...)',
                'sort.type': "Type d'accord (major, minor...)",
                'btn.reset': 'Réinitialiser',
                'count.one': '{n} accord trouvé',
                'count.many': '{n} accords trouvés',
                'pos.short': 'Pos. {n}',
                'footer.made': "Créé avec passion pour l'ukulélé.",
                'footer.github': 'Code source GitHub',
                'footer.linkedin': 'LinkedIn: François Parlant',
                'footer.youtube': 'Tutos YouTube: En parlant de bureautique'
            },
            en: {
                'page.title': 'Ukulele chord encyclopedia',
                'brand': 'Uke encyclopedia',
                'theme.toggle': 'Light / dark mode',
                'search.title': 'Chord search engine',
                'lbl.keys': 'Root(s) (Ctrl+Click)',
                'lbl.types': 'Chord type(s) (Ctrl+Click)',
                'lbl.pos': 'Position / Voicing (Ctrl+Click)',
                'hint.empty': 'Leave empty to show all',
                'hint.pos': 'Select the voicings you want',
                'pos.1': '1st position', 'pos.2': '2nd position', 'pos.3': '3rd position', 'pos.4': '4th position',
                'lbl.sort': 'Sort results by:',
                'sort.key': 'Key / Root (A, B, C...)',
                'sort.type': 'Chord type (major, minor...)',
                'btn.reset': 'Reset',
                'count.one': '{n} chord found',
                'count.many': '{n} chords found',
                'pos.short': 'Pos. {n}',
                'footer.made': 'Made with passion for the ukulele.',
                'footer.github': 'Source code on GitHub',
                'footer.linkedin': 'LinkedIn: François Parlant',
                'footer.youtube': 'YouTube tutorials: En parlant de bureautique'
            }
        });

        // --- 1. Gestion des thèmes (Sombre / Clair) ---
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlEl = document.documentElement;

        themeToggle.addEventListener('click', () => {
            if (htmlEl.getAttribute('data-bs-theme') === 'dark') {
                htmlEl.setAttribute('data-bs-theme', 'light');
                themeIcon.className = 'bi bi-moon-stars-fill';
            } else {
                htmlEl.setAttribute('data-bs-theme', 'dark');
                themeIcon.className = 'bi bi-sun-fill';
            }
        });

        // --- 2. Initialisation des filtres à partir du fichier ukulele.js ---
        const selectKeys = document.getElementById('selectKeys');
        const selectSuffixes = document.getElementById('selectSuffixes');
        const selectPositions = document.getElementById('selectPositions');
        const container = document.getElementById('schemaContainer');
        const resultsCountText = document.getElementById('resultsCount');

        // Alimenter le select des Fondamentales (Keys)
        chordLibrary.keys.forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = key;
            selectKeys.appendChild(opt);
        });

        // Alimenter le select des Suffixes (Types)
        chordLibrary.suffixes.forEach(suffix => {
            const opt = document.createElement('option');
            opt.value = suffix;
            opt.textContent = suffix;
            selectSuffixes.appendChild(opt);
        });

        // chords-db donne les barrés sous forme de liste de cases, ex. [1] ;
        // uke-chord attend une chaîne d'une case par corde, ex. "1111" ou "0111".
        // Le barré couvre les cordes allant de la 1re à la dernière jouée sur cette case.
        function barresToString(frets, barres) {
            const out = frets.map(function () { return '0'; });
            (barres || []).forEach(function (b) {
                let first = -1, last = -1;
                frets.forEach(function (f, i) {
                    if (f === b) { if (first === -1) first = i; last = i; }
                });
                if (first === -1 || first === last) return; // une seule corde : pas de barré
                for (let i = first; i <= last; i++) {
                    if (frets[i] >= b) out[i] = String(b);
                }
            });
            return out.join('');
        }

        // --- 3. Logique de filtrage et de tri ---
        function getSelectedValues(selectElement) {
            return Array.from(selectElement.selectedOptions).map(opt => opt.value);
        }

        function searchChords() {
            const selectedKeys = getSelectedValues(selectKeys);
            const selectedSuffixes = getSelectedValues(selectSuffixes);
            // On convertit les index des positions en entiers
            const selectedPositions = getSelectedValues(selectPositions).map(Number);
            
            const sortBy = document.querySelector('input[name="sortOrder"]:checked').value;
            const results = [];

            // Étape 1 : Filtrage
            // On parcourt toutes les notes (fondamentales) existantes dans la bibliothèque
            Object.keys(chordLibrary.chords).forEach(keyName => {
                // Filtre sur la fondamentale si sélectionnée
                if (selectedKeys.length > 0 && !selectedKeys.includes(keyName)) return;

                const chordsList = chordLibrary.chords[keyName];

                chordsList.forEach(chord => {
                    // Filtre sur le type d'accord si sélectionné
                    if (selectedSuffixes.length > 0 && !selectedSuffixes.includes(chord.suffix)) return;

                    // Parcourir les positions demandées
                    chord.positions.forEach((position, index) => {
                        // Filtre sur l'index de position demandé
                        if (selectedPositions.length > 0 && !selectedPositions.includes(index)) return;

                        // On prépare un objet structuré pour l'affichage et le tri
                        results.push({
                            key: chord.key,
                            suffix: chord.suffix,
                            positionIndex: index + 1, // Pour afficher "Pos. 1", "Pos. 2"...
                            // uke-chord écrit "position" à côté de la 1re case dessinée ; 0 = sillet.
                            // chords-db : baseFret = numéro de la 1re case dessinée (1 = position ouverte).
                            baseFret: position.baseFret === 1 ? 0 : position.baseFret,
                            frets: position.frets.join(""),
                            fingers: position.fingers.join(""),
                            barres: barresToString(position.frets, position.barres)
                        });
                    });
                });
            });

            // Étape 2 : Tri des résultats obtenus
            results.sort((a, b) => {
                if (sortBy === 'gamma') {
                    // Tri primaire par Fondamentale
                    if (a.key !== b.key) {
                        return chordLibrary.keys.indexOf(a.key) - chordLibrary.keys.indexOf(b.key);
                    }
                    // Tri secondaire par Suffixe
                    return a.suffix.localeCompare(b.suffix);
                } else {
                    // Tri primaire par Type d'accord
                    if (a.suffix !== b.suffix) {
                        return a.suffix.localeCompare(b.suffix);
                    }
                    // Tri secondaire par Fondamentale
                    return chordLibrary.keys.indexOf(a.key) - chordLibrary.keys.indexOf(b.key);
                }
            });

            // Étape 3 : Rendu HTML
            renderResults(results);
        }

        // --- 4. Rendu visuel dans la grille ---
        function renderResults(chords) {
            container.innerHTML = "";
            resultsCountText.textContent = FxI18n.t(chords.length > 1 ? 'count.many' : 'count.one', { n: chords.length });

            chords.forEach(chord => {
                const col = document.createElement('div');
                col.className = 'col';

                col.innerHTML = `
                    <div class="chord-card shadow-sm">
                        <div class="fw-bold fs-5 text-primary">${chord.key} <span class="text-muted fs-6">${chord.suffix}</span></div>
                        <div class="badge bg-secondary mb-2">${FxI18n.t('pos.short', { n: chord.positionIndex })}</div>
                        <uke-chord 
                            name="${chord.key}${chord.suffix === 'major' ? '' : ' ' + chord.suffix}" 
                            frets="${chord.frets}" 
                            barre="${chord.barres}" 
                            fingers="${chord.fingers}" 
                            sub="" 
                            position="${chord.baseFret}" 
                            length="5">
                        </uke-chord>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        // --- 5. Écouteurs d'événements ---
        [selectKeys, selectSuffixes, selectPositions].forEach(select => {
            select.addEventListener('change', searchChords);
        });

        document.querySelectorAll('input[name="sortOrder"]').forEach(radio => {
            radio.addEventListener('change', searchChords);
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            selectKeys.selectedIndex = -1;
            selectSuffixes.selectedIndex = -1;
            
            // On remet la sélection par défaut de la position 1
            Array.from(selectPositions.options).forEach((opt, idx) => {
                opt.selected = idx === 0;
            });

            document.getElementById('sortByGamma').checked = true;
            searchChords();
        });

        // Lancement initial de la recherche au chargement de la page
        searchChords();

        // Changement de langue : titre et compteur de résultats (les filtres restent)
        FxI18n.onChange(function () {
            document.title = FxI18n.t('page.title');
            searchChords();
        });
    </script>
    
    <!-- Script Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
