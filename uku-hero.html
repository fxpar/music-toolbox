<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Entraînement Rythmique Ukulélé</title>
    <script src="./js/i18n-fx.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css">
    <style>
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .chord-card { transition: all 0.3s ease; border: 3px solid transparent; }
        .active-chord { border-color: #0d6efd; transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,110,253,0.15); }
        .success-flash { animation: flashGreen 0.4s ease; }
        @keyframes flashGreen {
            0% { background-color: #ffffff; }
            50% { background-color: #d1e7dd; }
            100% { background-color: #ffffff; }
        }
        .progress-bar-inner { height: 6px; background-color: #0d6efd; width: 0%; transition: width 0.1s linear; }
    </style>
  <!-- Zone sûre (encoche / barre d'état), nécessite viewport-fit=cover. Ignoré par les vieux navigateurs. -->
  <style id="fx-safe-area">
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .offcanvas-start, .offcanvas-end {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-8">
            <div class="text-end">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-i18n-toggle>FR</button>
            </div>
            <h1 class="fw-bold mb-3" data-i18n="uh.h1">🎵 Coach Rythmique Ukulélé</h1>
            <p class="text-muted mb-4" data-i18n="uh.intro">Jouez la progression d'accords en rythme. L'application valide si vous êtes calé !</p>

            <div class="card p-4 mb-4 shadow-sm">
                <div class="row align-items-center g-3">
                    <div class="col-sm-6">
                        <label for="bpmRange" class="form-label fw-bold"><span data-i18n="uh.tempo">Tempo :</span> <span id="bpmValue">60</span> BPM</label>
                        <input type="range" class="form-range" id="bpmRange" min="40" max="120" value="60">
                    </div>
                    <div class="col-sm-6">
                        <button id="startBtn" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">🚀 Démarrer la session</button>
                    </div>
                </div>
            </div>

            <div class="w-100 bg-secondary-subtle rounded mb-4" style="height: 6px; overflow: hidden;">
                <div id="beatProgress" class="progress-bar-inner"></div>
            </div>

            <div class="row g-3 mb-4" id="progressionContainer">
                <div class="col-3">
                    <div id="card-0" class="card p-3 chord-card active-chord text-center">
                        <h2 class="fw-bold text-primary mb-1">C</h2>
                        <small class="text-muted" data-i18n="uh.notesC">Do, Mi, Sol</small>
                    </div>
                </div>
                <div class="col-3">
                    <div id="card-1" class="card p-3 chord-card text-center">
                        <h2 class="fw-bold text-dark mb-1">G</h2>
                        <small class="text-muted" data-i18n="uh.notesG">Sol, Si, Ré</small>
                    </div>
                </div>
                <div class="col-3">
                    <div id="card-2" class="card p-3 chord-card text-center">
                        <h2 class="fw-bold text-dark mb-1">Am</h2>
                        <small class="text-muted" data-i18n="uh.notesAm">La, Do, Mi</small>
                    </div>
                </div>
                <div class="col-3">
                    <div id="card-3" class="card p-3 chord-card text-center">
                        <h2 class="fw-bold text-dark mb-1">F</h2>
                        <small class="text-muted" data-i18n="uh.notesF">Fa, La, Do</small>
                    </div>
                </div>
            </div>

            <div class="card p-4 shadow-sm bg-white">
                <h4 class="text-muted mb-2" data-i18n="uh.statusTitle">Statut de votre jeu :</h4>
                <div id="gameStatus" class="display-6 fw-bold text-warning">Appuyez sur Démarrer</div>
                <div id="scoreStatus" class="fs-5 mt-2 text-success fw-semibold"></div>
            </div>

        </div>
    </div>
</div>

	<footer class="mt-auto py-3 bg-body-tertiary border-top text-body-secondary transition-colors">
	  <div class="container">
		<div class="row align-items-center gy-2">
		  <!-- Colonne 1 : Copyright & Titre -->
		  <div class="col-12 col-md-6 text-center text-md-start">
			<span class="small">
			  CC BY-NC 4.0 <span id="currentYear"></span><script>document.getElementById("currentYear").textContent = new Date().getFullYear();</script> <strong>François Parlant</strong> &mdash; <span data-i18n="footer.made">Créé avec passion pour le rythme et la mélodie.</span>
			</span>
		  </div>

		  <!-- Colonne 2 : Liens Réseaux Sociaux -->
		  <div class="col-12 col-md-6 text-center text-md-end">
			<div class="d-inline-flex gap-3 align-items-center">
			  <a href="https://github.com/fxpar/music-toolbox/blob/main/uku-hero.html" target="_blank" rel="noopener noreferrer" class="text-body-secondary text-decoration-none fs-5 hover-accent" title="Code source GitHub" data-i18n-title="footer.github"> 
				<i class="bi bi-github"></i> 
			  </a> 
			  <a href="https://www.linkedin.com/in/francois-parlant" target="_blank" rel="noopener noreferrer" class="text-body-secondary text-decoration-none fs-5 hover-accent" title="LinkedIn: François Parlant" data-i18n-title="footer.linkedin">
				<i class="bi bi-linkedin"></i> 
			  </a> 
			  <a href="https://www.youtube.com/c/enparlantdebureautiqueformezvous" target="_blank" rel="noopener noreferrer" class="text-body-secondary text-decoration-none fs-5 hover-accent" title="Tutos YouTube: En parlant de bureautique" data-i18n-title="footer.youtube">
				<i class="bi bi-youtube"></i> 
			  </a>
			</div>
		  </div>
		</div>
	  </div>
	</footer>



<script>
    FxI18n.add({
        fr: {
            "page.title": "Entraînement Rythmique Ukulélé",
            "uh.h1": "🎵 Coach Rythmique Ukulélé",
            "uh.intro": "Jouez la progression d'accords en rythme. L'application valide si vous êtes calé !",
            "uh.tempo": "Tempo :",
            "uh.start": "🚀 Démarrer la session",
            "uh.stop": "⏱️ Arrêter",
            "uh.notesC": "Do, Mi, Sol",
            "uh.notesG": "Sol, Si, Ré",
            "uh.notesAm": "La, Do, Mi",
            "uh.notesF": "Fa, La, Do",
            "uh.statusTitle": "Statut de votre jeu :",
            "uh.pressStart": "Appuyez sur Démarrer",
            "uh.play": "JOUEZ LE : {chord}",
            "uh.late": "❌ TROP TARD / RATE !",
            "uh.perfect": "✅ PARFAIT ! ({chord})",
            "uh.stopped": "Session arrêtée",
            "uh.score": "Précision : {ok}/{total} ({percent}%)",
            "uh.micError": "Erreur d'accès au micro : {err}",
            "footer.made": "Créé avec passion pour le rythme et la mélodie.",
            "footer.github": "Code source GitHub",
            "footer.linkedin": "LinkedIn: François Parlant",
            "footer.youtube": "Tutos YouTube: En parlant de bureautique"
        },
        en: {
            "page.title": "Ukulele Rhythm Training",
            "uh.h1": "🎵 Ukulele Rhythm Coach",
            "uh.intro": "Play the chord progression in time. The app checks whether you're locked in!",
            "uh.tempo": "Tempo:",
            "uh.start": "🚀 Start session",
            "uh.stop": "⏱️ Stop",
            "uh.notesC": "C, E, G",
            "uh.notesG": "G, B, D",
            "uh.notesAm": "A, C, E",
            "uh.notesF": "F, A, C",
            "uh.statusTitle": "Your playing status:",
            "uh.pressStart": "Press Start",
            "uh.play": "PLAY: {chord}",
            "uh.late": "❌ TOO LATE / MISSED!",
            "uh.perfect": "✅ PERFECT! ({chord})",
            "uh.stopped": "Session stopped",
            "uh.score": "Accuracy: {ok}/{total} ({percent}%)",
            "uh.micError": "Microphone access error: {err}",
            "footer.made": "Made with passion for rhythm and melody.",
            "footer.github": "GitHub source code",
            "footer.linkedin": "LinkedIn: François Parlant",
            "footer.youtube": "YouTube tutorials: En parlant de bureautique"
        }
    });

    // Dernier statut affiché (clé + variables) pour pouvoir le re-traduire
    var lastStatus = { key: 'uh.pressStart', vars: null };
    function setGameStatus(key, vars) {
        lastStatus = { key: key, vars: vars || null };
        document.getElementById('gameStatus').textContent = FxI18n.t(key, vars);
    }

    // 1. DÉFINITION DES ACCORDS ET LEURS FRÉQUENCES (Fondamentales adaptées au Ukulélé)
    const CHORDS_DB = [
        { name: "C",  notes: { C: [261.6], E: [329.6], G: [196.0, 392.0] } },
        { name: "G",  notes: { G: [196.0, 392.0], B: [246.9, 493.8], D: [293.7] } },
        { name: "Am", notes: { A: [220.0, 440.0], C: [261.6], E: [329.6] } },
        { name: "F",  notes: { F: [174.6, 349.2], A: [220.0, 440.0], C: [261.6] } }
    ];

    let currentChordIndex = 0;
    let bpm = 60;
    let isPlaying = false;
    let beatInterval = null;
    let audioContext, analyser, dataArray, sampleRate;
    let chordValidatedThisBeat = false;
    let successfulChords = 0;
    let totalBeats = 0;

    // DOM Elements
    const startBtn = document.getElementById('startBtn');
    const bpmRange = document.getElementById('bpmRange');
    const bpmValue = document.getElementById('bpmValue');
    const gameStatus = document.getElementById('gameStatus');
    const scoreStatus = document.getElementById('scoreStatus');
    const beatProgress = document.getElementById('beatProgress');

    bpmRange.addEventListener('input', (e) => {
        bpm = e.target.value;
        bpmValue.textContent = bpm;
        if(isPlaying) restartTimer();
    });

    startBtn.addEventListener('click', async () => {
        if (isPlaying) {
            stopGame();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false 
            });
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 4096;
            dataArray = new Float32Array(analyser.frequencyBinCount);
            sampleRate = audioContext.sampleRate;
            source.connect(analyser);

            isPlaying = true;
            startBtn.textContent = FxI18n.t('uh.stop');
            startBtn.className = "btn btn-danger btn-lg w-100 fw-bold shadow-sm";
            
            successfulChords = 0;
            totalBeats = 0;
            currentChordIndex = 0;
            updateVisualSequence();
            
            startGameLoop();
            requestAnimationFrame(detectLoop);

        } catch (err) {
            alert(FxI18n.t('uh.micError', { err: err }));
        }
    });

    function startGameLoop() {
        const intervalMs = (60 / bpm) * 1000;
        chordValidatedThisBeat = false;
        
        // Animation de la barre de progression temporelle
        beatProgress.style.transition = 'none';
        beatProgress.style.width = '0%';
        setTimeout(() => {
            beatProgress.style.transition = `width ${intervalMs}ms linear`;
            beatProgress.style.width = '100%';
        }, 10);

        setGameStatus('uh.play', { chord: CHORDS_DB[currentChordIndex].name });
        gameStatus.className = "display-6 fw-bold text-primary";

        beatInterval = setTimeout(() => {
            // Fin du temps imparti pour cet accord
            totalBeats++;
            if (!chordValidatedThisBeat) {
                setGameStatus('uh.late');
                gameStatus.className = "display-6 fw-bold text-danger";
            }

            // Passer à l'accord suivant
            document.getElementById(`card-${currentChordIndex}`).classList.remove('active-chord');
            document.getElementById(`card-${currentChordIndex}`).querySelector('h2').className = "fw-bold text-dark mb-1";
            
            currentChordIndex = (currentChordIndex + 1) % CHORDS_DB.length;
            
            updateVisualSequence();
            updateScore();
            
            if(isPlaying) startGameLoop();
        }, intervalMs);
    }

    function restartTimer() {
        clearTimeout(beatInterval);
        startGameLoop();
    }

    function stopGame() {
        isPlaying = false;
        clearTimeout(beatInterval);
        startBtn.textContent = FxI18n.t('uh.start');
        startBtn.className = "btn btn-success btn-lg w-100 fw-bold shadow-sm";
        setGameStatus('uh.stopped');
        gameStatus.className = "display-6 fw-bold text-muted";
        beatProgress.style.width = '0%';
    }

    function updateVisualSequence() {
        const activeCard = document.getElementById(`card-${currentChordIndex}`);
        activeCard.classList.add('active-chord');
        activeCard.querySelector('h2').className = "fw-bold text-primary mb-1";
    }

    function updateScore() {
        if(totalBeats > 0) {
            const percent = Math.round((successfulChords / totalBeats) * 100);
            scoreStatus.textContent = FxI18n.t('uh.score', { ok: successfulChords, total: totalBeats, percent: percent });
        }
    }

    // 2. BOUCLE DE DÉTECTION AUDIO SUR LES ACCORDS MULTIPLES
    function detectLoop() {
        if (!isPlaying) return;

        analyser.getFloatFrequencyData(dataArray);
        const threshold = -54; 
        const activeChord = CHORDS_DB[currentChordIndex];
        
        // Structure pour suivre les notes de l'accord en cours
        let notesStatus = {};
        for (let noteName in activeChord.notes) {
            notesStatus[noteName] = false;
        }

        // Scan des fréquences
        for (let i = 0; i < analyser.frequencyBinCount; i++) {
            let frequency = i * sampleRate / analyser.fftSize;
            let db = dataArray[i];

            if (db > threshold) {
                for (let noteName in activeChord.notes) {
                    let frequenciesToCheck = activeChord.notes[noteName];
                    frequenciesToCheck.forEach(targetFreq => {
                        if (Math.abs(frequency - targetFreq) < 6) {
                            notesStatus[noteName] = true;
                        }
                    });
                }
            }
        }

        // Vérification si toutes les notes requises sont là
        let allNotesDetected = Object.values(notesStatus).every(status => status === true);

        if (allNotesDetected && !chordValidatedThisBeat) {
            chordValidatedThisBeat = true;
            successfulChords++;
            setGameStatus('uh.perfect', { chord: activeChord.name });
            gameStatus.className = "display-6 fw-bold text-success";
            
            // Petit flash visuel vert sur la carte de l'accord réussi
            const card = document.getElementById(`card-${currentChordIndex}`);
            card.classList.add('success-flash');
            setTimeout(() => card.classList.remove('success-flash'), 400);
        }

        requestAnimationFrame(detectLoop);
    }

    // Changement de langue : re-traduire bouton, statut et score sans interrompre la session
    FxI18n.onChange(function () {
        document.title = FxI18n.t('page.title');
        startBtn.textContent = FxI18n.t(isPlaying ? 'uh.stop' : 'uh.start');
        gameStatus.textContent = FxI18n.t(lastStatus.key, lastStatus.vars);
        updateScore();
    });
</script>

</body>
</html>
